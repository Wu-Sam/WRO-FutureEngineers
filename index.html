<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO 2026 官方抽籤系統 | Future Engineers</title>
    <!-- 引入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0f4c81;
            --accent-blue: #0056b3;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: var(--bg-gradient); 
            color: #333; 
            margin: 0; 
            padding: 30px 20px; 
            min-height: 100vh;
        }

        h1 { 
            color: var(--primary-color); 
            font-size: 32px; 
            font-weight: 900;
            text-align: center; 
            margin-top: 10px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }
        
        /* ================= 左上角時鐘 (毛玻璃質感) ================= */
        #realtime-clock {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 1000;
            letter-spacing: 0.5px;
        }

        /* ================= 模式切換頁籤 ================= */
        .tab-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 18px; 
            padding: 12px 35px; 
            border: 2px solid transparent; 
            border-radius: 50px; 
            background-color: white; 
            color: #666; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .tab-btn:hover { color: var(--accent-blue); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .tab-btn.active { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: #fff; 
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.4); 
            border: 2px solid transparent;
        }

        /* ================= 控制區與按鈕 ================= */
        .controls { 
            text-align: center; 
            margin-bottom: 30px; 
            padding: 25px; 
            background: var(--panel-bg); 
            border-radius: 16px; 
            box-shadow: var(--shadow-soft); 
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255,255,255,0.8);
        }
        .btn-group { display: flex; justify-content: center; gap: 20px; } 
        
        button.draw-btn { 
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            color: white; font-weight: 700; font-size: 18px; 
            padding: 14px 30px; border: none; border-radius: 10px; 
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
            letter-spacing: 1px;
        }
        button.draw-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(56, 239, 125, 0.6); }
        
        button.reset-btn { 
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%); 
            color: white; font-weight: 700; font-size: 18px; 
            padding: 14px 30px; border: none; border-radius: 10px; 
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 94, 98, 0.4);
        }
        button.reset-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(255, 94, 98, 0.6); }
        
        #mode-hint { margin-top: 15px; font-size: 15px; color: #555; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; display: inline-block;}

        /* ================= 主內容區 ================= */
        .main-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 1300px; margin: 0 auto;}
        
        /* 左側文字資訊面板 */
        .info-panel { 
            flex: 1; min-width: 340px; max-width: 420px; 
            background: var(--panel-bg); padding: 30px; 
            border-radius: 16px; line-height: 2.2; 
            box-shadow: var(--shadow-soft); 
            border-top: 6px solid var(--primary-color); 
            font-size: 16px; 
            backdrop-filter: blur(5px);
        }
        .section-title { 
            font-weight: 900; color: var(--primary-color); 
            margin-top: 0; margin-bottom: 20px; font-size: 22px; 
            border-bottom: 2px dashed #ccc; padding-bottom: 12px; 
        }
        .info-panel strong { color: #222; }
        
        /* 右側地圖面板 */
        .map-panel { 
            flex: 2; min-width: 500px; max-width: 800px; 
            background: var(--panel-bg); padding: 25px; 
            border-radius: 16px; box-shadow: var(--shadow-soft); 
            display: flex; justify-content: center; align-items: center; 
        }
        
        /* ================= 賽道底板 (加入地墊網格紋理) ================= */
        .map-container { 
            position: relative; width: 100%; max-width: 700px; aspect-ratio: 1 / 1; 
            background-color: #fafafa; 
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden; border-radius: 12px; 
            border: 2px solid #ddd;
        }
        
        /* 賽道標線 */
        .track-wall { position: absolute; box-sizing: border-box; }
        .outer-wall { 
            top: 10%; bottom: 10%; left: 10%; right: 10%; 
            border: 8px solid #2b2b2b; border-radius: 12%; 
            background-color: #3b3b3b; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2) inset, 0 5px 15px rgba(0,0,0,0.1); 
            z-index: 1; 
        }
        .center-line { 
            top: 18%; bottom: 18%; left: 18%; right: 18%; 
            border: 3px dashed rgba(255, 255, 255, 0.6); border-radius: 8%; 
            pointer-events: none; z-index: 2; 
        }
        .inner-wall { 
            top: 26%; bottom: 26%; left: 26%; right: 26%; 
            border: 8px solid #2b2b2b; border-radius: 4%; 
            background-color: #fafafa; 
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            z-index: 4; 
        }

        .boundary-line { position: absolute; z-index: 3; box-shadow: 0 0 5px rgba(0,0,0,0.3);}
        .line-v-blue { width: 6px; height: 16.5%; background-color: #0066cc; }
        .line-h-orange { height: 6px; width: 16.5%; background-color: #ff6600; }
        
        /* ================= 視覺化元素 (升級 3D 質感) ================= */
        /* 決賽：柱子與停車場 */
        .overlay { 
            position: absolute; transform: translate(-50%, -50%); 
            width: 4%; aspect-ratio: 1 / 1; border-radius: 50%; 
            box-shadow: 2px 4px 8px rgba(0,0,0,0.6), inset -2px -2px 6px rgba(0,0,0,0.3), inset 2px 2px 6px rgba(255,255,255,0.5); 
            z-index: 10; border: 2px solid #fff; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* 給柱子加上圓柱體光影 */
        .pillar-red { background: radial-gradient(circle at 30% 30%, #ff4b4b, #cc0000); }
        .pillar-green { background: radial-gradient(circle at 30% 30%, #32cd32, #008000); }
        
        .parking-zone { 
            position: absolute; border: 3px dashed #F702F9; 
            background-color: rgba(247, 2, 249, 0.15); z-index: 5; 
            display: flex; align-items: center; justify-content: center; 
            color: #F702F9; font-weight: 900; font-size: 24px; font-family: Arial, sans-serif;
            border-radius: 6px; text-shadow: 1px 1px 0px #fff;
            box-shadow: inset 0 0 10px rgba(247, 2, 249, 0.2);
            animation: pulse-parking 2s infinite alternate;
        }
        @keyframes pulse-parking {
            from { background-color: rgba(247, 2, 249, 0.1); }
            to { background-color: rgba(247, 2, 249, 0.25); }
        }

        /* 資格賽：起點格 */
        .start-zone-marker {
            position: absolute; transform: translate(-50%, -50%); z-index: 4;
            border: 2px dashed #999; background-color: rgba(255, 255, 255, 0.85);
            width: 7%; aspect-ratio: 1 / 1; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold; color: #888;
            transition: all 0.3s;
        }
        .start-zone-active { 
            border: 3px solid #28a745; 
            background-color: rgba(40, 167, 69, 0.2); 
            color: #155724; z-index: 5; 
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.4);
        }

        /* 資格賽：牆體與起點車 */
        .wall-block {
            position: absolute; z-index: 6; border: 2px solid #111; border-radius: 3px;
            background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 12px, #222 12px, #222 24px);
            box-shadow: 3px 3px 8px rgba(0,0,0,0.6); opacity: 0.95;
        }
        .start-car {
            position: absolute; transform: translate(-50%, -50%); z-index: 15;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: 2px solid #333; border-radius: 6px;
            width: 6%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
            font-size: 20px; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.6);
            animation: bounce-drop 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        @keyframes bounce-drop {
            0% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
            70% { transform: translate(-50%, -40%) scale(0.9); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body onload="init()">

    <div id="realtime-clock">讀取時間中...</div>

    <h1>WRO 2026 未來工程師 (官方抽籤系統)</h1>

    <div class="tab-container">
        <button id="tab-open" class="tab-btn active" onclick="switchMode('open')">🏁 資格賽 (Open Challenge)</button>
        <button id="tab-obstacle" class="tab-btn" onclick="switchMode('obstacle')">🚧 決賽 (Obstacle Challenge)</button>
    </div>
    
    <div class="controls">
        <div class="btn-group">
            <button class="draw-btn" id="main-draw-btn" onclick="runDraw()">🎲 執行資格賽抽籤</button>
            <button class="reset-btn" onclick="resetDraw()">🔄 重設畫面</button>
        </div>
        <div id="mode-hint">
            💡 <strong>資格賽模式：</strong>抽出牆體寬窄 (窄牆將以黃黑警示塊阻擋內側車道) 與 1-6 號起點格。
        </div>
    </div>

    <div class="main-container">
        <!-- 左側面板 -->
        <div class="info-panel" id="result-info">
            <div style="text-align: center; color: #888; font-size: 18px; margin-top: 50px;">
                👆 請點擊上方綠色按鈕進行抽籤...
            </div>
        </div>

        <!-- 右側面板 -->
        <div class="map-panel">
            <div class="map-container" id="map-container">
                <div class="track-wall outer-wall"></div>
                <div class="track-wall center-line"></div>
                
                <div class="boundary-line line-v-blue" style="top: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="top: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; bottom: 26%; transform: translateY(50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; bottom: 26%; transform: translateY(50%);"></div>

                <div class="track-wall inner-wall"></div>
                
                <div id="overlays-layer"></div>
            </div>
        </div>
    </div>

    <script>
        function init() {
            updateClock(); 
            setInterval(updateClock, 1000); 
            switchMode('open'); 
        }

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeString = `🕒 ${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('realtime-clock').innerText = timeString;
        }

        let currentMode = 'open'; 

        function resetDraw() {
            document.getElementById('overlays-layer').innerHTML = ''; 
            document.getElementById('result-info').innerHTML = '<div style="text-align: center; color: #888; font-size: 18px; margin-top: 50px;">👆 請點擊上方綠色按鈕進行抽籤...</div>';
        }

        function switchMode(mode) {
            currentMode = mode;
            resetDraw();

            document.getElementById('tab-open').classList.remove('active');
            document.getElementById('tab-obstacle').classList.remove('active');
            document.getElementById(`tab-${mode}`).classList.add('active');

            const btn = document.getElementById('main-draw-btn');
            const hint = document.getElementById('mode-hint');

            if (mode === 'open') {
                btn.innerHTML = '🎲 執行資格賽 (Open) 抽籤';
                hint.innerHTML = '💡 <strong>資格賽模式：</strong>抽出牆體寬窄 (窄牆將以黃黑警示塊阻擋內側車道) 與 1-6 號起點格。';
            } else {
                btn.innerHTML = '🎲 執行決賽 (Obstacle) 抽籤';
                hint.innerHTML = '💡 <strong>決賽模式：</strong>機器人從單一標誌區出發，包含停車場配置與雙柱卡牌。';
            }
        }

        const tossCoin = () => Math.random() < 0.5 ? "Heads" : "Tails";
        const getSectionInfo = () => {
            const t1 = tossCoin(), t2 = tossCoin();
            if (t1==="Heads" && t2==="Heads") return { id: "Top", name: "上方區 (Top)" };
            if (t1==="Heads" && t2==="Tails") return { id: "Right", name: "右側區 (Right)" };
            if (t1==="Tails" && t2==="Heads") return { id: "Left", name: "左側區 (Left)" };
            return { id: "Bottom", name: "下方區 (Bottom)" };
        };

        const CARD_LAYOUTS = {
            1: [["p2", "Green", "Inner"]], 2: [["p2", "Red", "Inner"]],
            3: [["p2", "Green", "Outer"]], 4: [["p2", "Red", "Outer"]],
            5: [["p3", "Green", "Inner"], ["p1", "Green", "Inner"]],
            6: [["p3", "Green", "Inner"], ["p1", "Red", "Inner"]],
            7: [["p3", "Green", "Inner"], ["p1", "Green", "Outer"]],
            8: [["p3", "Green", "Inner"], ["p1", "Red", "Outer"]],
            9: [["p3", "Red", "Inner"], ["p1", "Green", "Inner"]],
            10: [["p3", "Red", "Inner"], ["p1", "Red", "Inner"]],
            11: [["p3", "Red", "Inner"], ["p1", "Green", "Outer"]],
            12: [["p3", "Red", "Inner"], ["p1", "Red", "Outer"]],
            13: [["p3", "Green", "Outer"], ["p1", "Green", "Inner"]],
            14: [["p3", "Green", "Outer"], ["p1", "Red", "Inner"]],
            15: [["p3", "Green", "Outer"], ["p1", "Green", "Outer"]],
            16: [["p3", "Green", "Outer"], ["p1", "Red", "Outer"]],
            17: [["p3", "Red", "Outer"], ["p1", "Green", "Inner"]],
            18: [["p3", "Red", "Outer"], ["p1", "Red", "Inner"]],
            19: [["p3", "Red", "Outer"], ["p1", "Green", "Outer"]],
            20: [["p3", "Red", "Outer"], ["p1", "Red", "Outer"]]
        };

        const COORDS = {
            "Top": { "Outer": { "p1": [34, 14], "p2": [50, 14], "p3": [66, 14] }, "Inner": { "p1": [34, 22], "p2": [50, 22], "p3": [66, 22] } },
            "Right": { "Outer": { "p1": [86, 34], "p2": [86, 50], "p3": [86, 66] }, "Inner": { "p1": [78, 34], "p2": [78, 50], "p3": [78, 66] } },
            "Bottom": { "Outer": { "p1": [66, 86], "p2": [50, 86], "p3": [34, 86] }, "Inner": { "p1": [66, 78], "p2": [50, 78], "p3": [34, 78] } },
            "Left": { "Outer": { "p1": [14, 66], "p2": [14, 50], "p3": [14, 34] }, "Inner": { "p1": [22, 66], "p2": [22, 50], "p3": [22, 34] } }
        };

        function addPillar(secId, pos, color, row, hasParking) {
            const actualRow = hasParking ? "Inner" : row; 
            const xy = COORDS[secId][actualRow][pos];
            const el = document.createElement('div');
            el.className = `overlay ${color === "Red" ? 'pillar-red' : 'pillar-green'}`;
            el.style.left = `${xy[0]}%`;
            el.style.top = `${xy[1]}%`;
            document.getElementById('overlays-layer').appendChild(el);
        }

        function drawParking(secId) {
            const el = document.createElement('div');
            el.className = 'parking-zone'; el.innerHTML = "P";
            if(secId === "Top") { el.style.left='44%'; el.style.top='10%'; el.style.width='12%'; el.style.height='8%'; }
            if(secId === "Right") { el.style.left='82%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; }
            if(secId === "Bottom") { el.style.left='44%'; el.style.top='82%'; el.style.width='12%'; el.style.height='8%'; }
            if(secId === "Left") { el.style.left='10%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; }
            document.getElementById('overlays-layer').appendChild(el);
        }

        const OPEN_GRID_COORDS = {
            "Top": { 1: [34, 23], 2: [66, 23], 3: [34, 18], 4: [66, 18], 5: [34, 13], 6: [66, 13] },
            "Right": { 1: [77, 34], 2: [77, 66], 3: [82, 34], 4: [82, 66], 5: [87, 34], 6: [87, 66] },
            "Bottom": { 1: [66, 77], 2: [34, 77], 3: [66, 82], 4: [34, 82], 5: [66, 87], 6: [34, 87] },
            "Left": { 1: [23, 34], 2: [23, 66], 3: [18, 34], 4: [18, 66], 5: [13, 34], 6: [13, 66] }
        };

        function drawNarrowWall(secId) {
            const el = document.createElement('div');
            el.className = 'wall-block';
            if(secId === "Top") { el.style.left='26%'; el.style.top='18%'; el.style.width='48%'; el.style.height='8%'; }
            if(secId === "Right") { el.style.left='74%'; el.style.top='26%'; el.style.width='8%'; el.style.height='48%'; }
            if(secId === "Bottom") { el.style.left='26%'; el.style.top='74%'; el.style.width='48%'; el.style.height='8%'; }
            if(secId === "Left") { el.style.left='18%'; el.style.top='26%'; el.style.width='8%'; el.style.height='48%'; }
            document.getElementById('overlays-layer').appendChild(el);
        }

        function drawStartGrid(secId, activeZone, isWide) {
            const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6]; 
            validZones.forEach(zoneId => {
                const el = document.createElement('div');
                el.className = `start-zone-marker ${zoneId === activeZone ? 'start-zone-active' : ''}`;
                el.innerHTML = (zoneId === activeZone) ? '' : zoneId; 
                const xy = OPEN_GRID_COORDS[secId][zoneId];
                el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
                document.getElementById('overlays-layer').appendChild(el);
            });
        }

        function drawStartCar(secId, zoneId) {
            const el = document.createElement('div');
            el.className = 'start-car'; el.innerHTML = "🚗";
            const xy = OPEN_GRID_COORDS[secId][zoneId];
            el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
            document.getElementById('overlays-layer').appendChild(el);
        }

        function runDraw() {
            resetDraw(); 
            let html = "";
            const dirEng = Math.random() < 0.5 ? "Clockwise" : "Counter-Clockwise";
            const dirChn = dirEng === "Clockwise" ? "順時針 (↻)" : "逆時針 (↺)";

            if (currentMode === 'open') {
                html += `<div class="section-title">🏁 資格賽 (Open) 結果</div>`;
                html += `<strong>1. 行駛方向：</strong> <span style="color:#cc0000; font-weight:bold; font-size:18px;">${dirChn}</span><br>`;
                
                const s = getSectionInfo();
                html += `<strong>2. 起始賽段：</strong> <span style="color:#0066cc; font-weight:bold; font-size:18px;">${s.name}</span><br>`;

                html += `<br><strong>3. 賽道寬窄 (內圍牆設置)：</strong><br>`;
                const sections = ["Top", "Right", "Bottom", "Left"];
                const sectionNames = {"Top": "上方", "Right": "右側", "Bottom": "下方", "Left": "左側"};
                
                let startSectionIsWide = true;

                sections.forEach(sec => {
                    const isWide = tossCoin() === "Heads";
                    if (sec === s.id) startSectionIsWide = isWide;
                    html += `&nbsp;&nbsp;➔ ${sectionNames[sec]}區：<strong>${isWide ? "<span style='color:#008000; background:#e6ffe6; padding:2px 6px; border-radius:4px;'>寬 (Wide)</span>" : "<span style='color:#cc0000; background:#ffe6e6; padding:2px 6px; border-radius:4px;'>窄 (Narrow) - 阻擋內道</span>"}</strong><br>`;
                    if (!isWide) drawNarrowWall(sec);
                });

                const validZones = startSectionIsWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6];
                const randomIndex = Math.floor(Math.random() * validZones.length);
                const startZone = validZones[randomIndex];

                html += `<br><strong>4. 起點位置：</strong> 位於 <span style="color:#F702F9; font-weight:bold; font-size:18px;">第 ${startZone} 格</span><br>`;
                
                drawStartGrid(s.id, startZone, startSectionIsWide);
                drawStartCar(s.id, startZone);

            } else {
                const s = getSectionInfo(); 
                const p = getSectionInfo(); 
                const config = { single_sign_section: s.id, parking_section: p.id };
                
                const singleCardNum = Math.floor(Math.random() * 4) + 1;
                config.single_sign_card = singleCardNum;

                let doubleDeck = Array.from({length: 16}, (_, i) => i + 5); 
                doubleDeck.sort(() => Math.random() - 0.5);

                const sections = ["Top", "Right", "Bottom", "Left"];
                const sectionNames = {"Top": "上方", "Right": "右側", "Bottom": "下方", "Left": "左側"};
                const other_sections = sections.filter(sec => sec !== config.single_sign_section);
                
                config.other_sections_layout = {};
                other_sections.forEach(sec => {
                    config.other_sections_layout[sec] = doubleDeck.pop();
                });

                html += `<div class="section-title">🚧 決賽 (Obstacle) 結果</div>`;
                html += `<strong>1. 行駛方向：</strong> <span style="color:#cc0000; font-weight:bold; font-size:18px;">${dirChn}</span><br>`;
                html += `<strong>2. 起點與單標誌區：</strong> <span style="color:#0066cc; font-weight:bold; font-size:18px;">${s.name}</span><br>`;
                html += `<strong>3. 停車場位置：</strong> <span style="color:#F702F9; font-weight:bold; font-size:18px; background: rgba(247, 2, 249, 0.1); padding:2px 6px; border-radius:4px;">${p.name}</span><br>`;

                const singleData = CARD_LAYOUTS[singleCardNum][0];
                const sColorName = singleData[1] === "Green" ? "綠柱" : "紅柱";
                const sColorHex = singleData[1] === "Green" ? "#008000" : "#cc0000";
                const sLaneName = singleData[2] === "Inner" ? "內側" : "外側";
                const sForceHint = (s.id === p.id && singleData[2] === "Outer") ? " <span style='color:#ff0000; font-size:13px; background:#fff0f0; padding:1px 4px; border-radius:3px;'>(因停車場退至內側)</span>" : "";
                
                html += `<br><strong>4. 單一標誌配置：</strong><br>`;
                html += `&nbsp;&nbsp;➔ <span style='color:${sColorHex}; font-weight:bold;'>${sColorName} (${sLaneName} - 卡牌 #${singleCardNum})</span>${sForceHint}<br>`;

                html += `<br><strong>5. 雙柱配置 (其他區域)：</strong><br>`;
                other_sections.forEach(sec => {
                    const cardNum = config.other_sections_layout[sec];
                    const layout = CARD_LAYOUTS[cardNum];
                    const hasOuterPillar = layout.some(pillar => pillar[2] === "Outer");
                    const dForceHint = (sec === p.id && hasOuterPillar) ? " <span style='color:#ff0000; font-size:13px; background:#fff0f0; padding:1px 4px; border-radius:3px;'>(因停車場退至內側)</span>" : "";
                    
                    html += `&nbsp;&nbsp;➔ ${sectionNames[sec]}區：<strong>卡牌 #${cardNum}</strong>${dForceHint}<br>`;
                });

                const all_layouts = { ...config.other_sections_layout };
                all_layouts[config.single_sign_section] = config.single_sign_card;

                for (const [sec, cardNum] of Object.entries(all_layouts)) {
                    const layout = CARD_LAYOUTS[cardNum];
                    const hasParking = (sec === config.parking_section);
                    layout.forEach(pillar => {
                        const [pos, color, row] = pillar;
                        addPillar(sec, pos, color, row, hasParking);
                    });
                }
                drawParking(config.parking_section);
                
                // 決賽專屬：在單一標誌區(起點)加上一台車子示意出發位置 (放在內外圈中間)
                const startCarEl = document.createElement('div');
                startCarEl.className = 'start-car'; 
                startCarEl.innerHTML = "🚗";
                const xy = COORDS[s.id]["Inner"]["p2"]; // 將車放在該區塊正中間稍微靠後
                let carTop = xy[1];
                let carLeft = xy[0];
                
                // 稍微調整車子位置不要壓到柱子，並表明進入方向
                if(s.id === "Top") { carTop = 18; carLeft = 10; } // 從左上角進入Top區
                if(s.id === "Right") { carTop = 10; carLeft = 82; }
                if(s.id === "Bottom") { carTop = 82; carLeft = 90; }
                if(s.id === "Left") { carTop = 90; carLeft = 18; }

                startCarEl.style.left = `${carLeft}%`;
                startCarEl.style.top = `${carTop}%`;
                document.getElementById('overlays-layer').appendChild(startCarEl);
            }

            document.getElementById('result-info').innerHTML = html;
        }
    </script>
</body>
</html>
