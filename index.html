<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO 2026 官方抽籤系統 | Future Engineers (高質感藍色科技版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0f4c81;
            --accent-blue: #0072ff;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-border: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* 藍色系動態漸層科技感背景 */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b, #0072ff);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: #2c3e50; margin: 0; padding: 35px 20px; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 { 
            color: #ffffff; font-size: 34px; font-weight: 900;
            text-align: center; margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }
        
        #realtime-clock {
            position: fixed; top: 20px; left: 20px; font-size: 14px; font-weight: 700;
            color: #fff; background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px; border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); z-index: 1000;
        }

        /* 側邊欄按鈕：高質感發光懸浮 */
        .toggle-sidebar-btn {
            position: fixed; top: 20px; right: 20px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white; padding: 11px 22px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.4); z-index: 1000;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toggle-sidebar-btn:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 0 12px 30px rgba(0, 114, 255, 0.6); 
        }

        /* 側邊欄：毛玻璃風格 */
        .sidebar {
            position: fixed; top: 0; right: -420px; width: 380px; height: 100vh;
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: -10px 0 40px rgba(0,0,0,0.2); 
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1001; padding: 25px; box-sizing: border-box; overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.6);
        }
        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid rgba(0,0,0,0.06); padding-bottom: 15px; margin-bottom: 15px;
        }
        .sidebar-header h2 { margin: 0; color: var(--primary-color); font-size: 20px; font-weight: 900; }

        .close-btn { background: transparent; color: #777; font-size: 28px; border: none; cursor: pointer; padding: 0; line-height: 1; transition: color 0.2s; }
        .close-btn:hover { color: #111; }

        /* 歷史紀錄批次操作工具列 */
        .history-tools {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-size: 13px; font-weight: 700; color: #555;
            background: rgba(0,0,0,0.04); padding: 8px 12px; border-radius: 8px;
        }
        .history-tools button {
            background: #ff4757; color: white; border: none; padding: 5px 10px;
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; transition: background 0.2s;
        }
        .history-tools button:hover { background: #ff3343; }

        /* 歷史紀錄卡片優化 */
        .history-item {
            background: rgba(255, 255, 255, 0.9); border-left: 5px solid #0072ff; padding: 14px;
            margin-bottom: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.8);
            transition: transform 0.2s; position: relative;
        }
        .history-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .history-item.fail { border-left-color: #ff4757; }
        .history-item.success { border-left-color: #2ed573; }

        .history-item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .history-title { font-size: 15px; font-weight: 900; color: var(--primary-color); }
        
        .history-time { font-size: 11px; color: #777; margin-bottom: 8px; font-weight: 500; }
        .history-content { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        
        .history-actions { display: flex; gap: 6px; justify-content: space-between; align-items: center; }
        .history-actions div { display: flex; gap: 5px; }
        .history-actions button { padding: 5px 8px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; transition: all 0.2s; }
        .btn-restore { background: #e1f5fe; color: #0288d1; }
        .btn-restore:hover { background: #b3e5fc; transform: scale(1.05); }
        .btn-mark-success { background: #e8f5e9; color: #2e7d32; }
        .btn-mark-fail { background: #ffebee; color: #c62828; }
        .btn-delete-single { background: #f1f2f6; color: #ff4757; }
        .btn-delete-single:hover { background: #ff4757; color: white; }

        /* 互動提示文字 */
        .interactive-text {
            display: inline-block; cursor: pointer; padding: 3px 8px; border-radius: 6px;
            background: rgba(0, 114, 255, 0.1); color: #0056b3; font-weight: 700;
            transition: all 0.2s; border: 1px dashed rgba(0, 114, 255, 0.4); margin: 2px 0;
        }
        .interactive-text:hover { background: rgba(0, 114, 255, 0.2); transform: scale(1.04); }

        /* 模式切換按鈕 */
        .tab-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            font-family: 'Noto Sans TC', sans-serif; font-size: 17px; 
            padding: 12px 32px; border-radius: 50px; background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); color: #fff; font-weight: 700; cursor: pointer; 
            transition: all 0.3s; box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        .tab-btn.active { 
            background: #ffffff; color: var(--primary-color); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); 
            border-color: #fff;
        }

        /* 控制面板：玻璃擬態 */
        .controls { 
            text-align: center; margin-bottom: 30px; padding: 25px; 
            background: var(--panel-bg); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-soft); max-width: 800px; margin: 0 auto 30px auto;
        }
        .btn-group { display: flex; justify-content: center; gap: 20px; } 
        button.draw-btn { 
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%); 
            color: white; font-weight: 700; font-size: 17px; 
            padding: 14px 32px; border: none; border-radius: 12px; cursor: pointer; 
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.4); transition: all 0.3s;
        }
        button.draw-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 30px rgba(0, 114, 255, 0.6); }
        
        button.reset-btn { 
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); 
            color: white; font-weight: 700; font-size: 17px; 
            padding: 14px 32px; border: none; border-radius: 12px; cursor: pointer; 
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4); transition: all 0.3s;
        }
        button.reset-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 30px rgba(255, 65, 108, 0.6); }
        
        #mode-hint { margin-top: 15px; font-size: 14px; color: #444; background: rgba(255,255,255,0.6); padding: 10px 15px; border-radius: 8px; display: inline-block; font-weight: 500;}

        /* 主內容區容器 */
        .main-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 1300px; margin: 0 auto;}
        
        /* 資訊面板 */
        .info-panel { 
            flex: 1; min-width: 340px; max-width: 420px; 
            background: var(--panel-bg); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px; border-radius: 20px; line-height: 2.2; 
            box-shadow: var(--shadow-soft); border: 1px solid var(--panel-border);
            border-top: 6px solid var(--primary-color); font-size: 16px; 
        }
        .section-title { 
            font-weight: 900; color: var(--primary-color); 
            margin-top: 0; margin-bottom: 20px; font-size: 21px; 
            border-bottom: 2px dashed rgba(0,0,0,0.1); padding-bottom: 12px; 
        }
        
        /* 地圖面板 */
        .map-panel { 
            flex: 2; min-width: 500px; max-width: 800px; 
            background: var(--panel-bg); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px; border-radius: 20px; border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-soft); display: flex; justify-content: center; align-items: center; 
        }
        
        /* 賽道底板 */
        .map-container { 
            position: relative; width: 100%; max-width: 700px; aspect-ratio: 1 / 1; 
            background-color: #ffffff; 
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 25px 25px; overflow: hidden; border-radius: 16px; 
            border: 3px solid rgba(255,255,255,0.8);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        
        .track-wall { position: absolute; box-sizing: border-box; }
        .outer-wall { 
            top: 10%; bottom: 10%; left: 10%; right: 10%; 
            border: 8px solid #2b2b2b; border-radius: 12%; 
            background-color: #3b3b3b; z-index: 1; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .center-line { 
            top: 18%; bottom: 18%; left: 18%; right: 18%; 
            border: 3px dashed rgba(255, 255, 255, 0.65); border-radius: 8%; z-index: 2; 
        }
        .inner-wall { 
            top: 26%; bottom: 26%; left: 26%; right: 26%; 
            border: 8px solid #2b2b2b; border-radius: 4%; 
            background-color: #ffffff; 
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 25px 25px; z-index: 4; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .boundary-line { position: absolute; z-index: 3;}
        .line-v-blue { width: 6px; height: 16.5%; background-color: #0066cc; }
        .line-h-orange { height: 6px; width: 16.5%; background-color: #ff6600; }
        
        /* 視覺化元素 */
        .overlay { 
            position: absolute; transform: translate(-50%, -50%); 
            width: 4%; aspect-ratio: 1 / 1; border-radius: 50%; z-index: 10; 
            border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .pillar-red { background: radial-gradient(circle at 30% 30%, #ff4b4b, #cc0000); }
        .pillar-green { background: radial-gradient(circle at 30% 30%, #32cd32, #008000); }
        
        /* 停車場 */
        .parking-zone { 
            position: absolute; border: 3px dashed #F702F9; 
            background-color: rgba(247, 2, 249, 0.12); z-index: 5; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 8px; box-shadow: inset 0 0 15px rgba(247, 2, 249, 0.2);
        }
        .car-in-parking {
            font-size: 34px; animation: float-car 1.5s infinite alternate ease-in-out;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        @keyframes float-car {
            from { transform: translateY(-2px); }
            to { transform: translateY(2px); }
        }

        .start-zone-marker {
            position: absolute; transform: translate(-50%, -50%); z-index: 4;
            border: 2px dashed #aaa; background-color: rgba(255, 255, 255, 0.75);
            width: 7%; aspect-ratio: 1 / 1; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700; color: #666;
        }
        .start-zone-active { 
            border: 3px solid #ff3300; background-color: rgba(255, 51, 0, 0.25); 
            z-index: 5; box-shadow: 0 0 20px rgba(255, 51, 0, 0.6);
            transform: translate(-50%, -50%) scale(1.1);
        }
        .wall-block {
            position: absolute; z-index: 6; border: 2px solid #111; border-radius: 4px;
            background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 12px, #222 12px, #222 24px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .open-car {
            position: absolute; transform: translate(-50%, -50%); z-index: 15;
            font-size: 36px; filter: drop-shadow(2px 6px 10px rgba(0,0,0,0.4));
            animation: bounce-drop 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        @keyframes bounce-drop {
            0% { transform: translate(-50%, -150%) scale(1.3); opacity: 0; }
            70% { transform: translate(-50%, -40%) scale(0.9); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .highlight-ripple {
            position: absolute; transform: translate(-50%, -50%);
            width: 50px; height: 50px; border-radius: 50%;
            border: 3px solid #ffe600; background: rgba(255, 230, 0, 0.45);
            z-index: 25; animation: ripple-effect 0.8s ease-out forwards;
        }
        @keyframes ripple-effect {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        }
    </style>
</head>
<body onload="init()">

    <div id="realtime-clock">讀取時間中...</div>

    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">📜 開啟歷史紀錄</button>

    <div class="sidebar" id="mySidebar">
        <div class="sidebar-header">
            <h2>場地抽籤歷史紀錄</h2>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        
        <div class="history-tools">
            <label><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"> 全選紀錄</label>
            <button onclick="deleteSelectedRecords()">🗑️ 刪除選取紀錄</button>
        </div>

        <div id="historyList">
            <div style="text-align: center; color: #777; margin-top: 40px; font-size: 14px;">目前尚無抽籤紀錄，請點擊畫面上的按鈕開始抽籤！</div>
        </div>
    </div>

    <h1>WRO 2026 未來工程師 (官方抽籤系統)</h1>

    <div class="tab-container">
        <button id="tab-open" class="tab-btn active" onclick="switchMode('open')">🏁 資格賽 (Open Challenge)</button>
        <button id="tab-obstacle" class="tab-btn" onclick="switchMode('obstacle')">🚧 決賽 (Obstacle Challenge)</button>
    </div>
    
    <div class="controls">
        <div class="btn-group">
            <button class="draw-btn" id="main-draw-btn" onclick="runDraw()">🎲 執行資格賽抽籤</button>
            <button class="reset-btn" onclick="resetDraw()">🔄 重設畫面</button>
        </div>
        <div id="mode-hint">💡 <strong>資格賽模式：</strong>點擊抽籤結果中的項目文字，地圖上會產生圖示與特效提示！</div>
    </div>

    <div class="main-container">
        <div class="info-panel" id="result-info">
            <div style="text-align: center; color: #777; font-size: 18px; margin-top: 50px;">👆 請點擊上方藍色按鈕進行抽籤...</div>
        </div>

        <div class="map-panel">
            <div class="map-container" id="map-container">
                <div class="track-wall outer-wall"></div>
                <div class="track-wall center-line"></div>
                
                <div class="boundary-line line-v-blue" style="top: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="top: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; bottom: 26%; transform: translateY(50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; bottom: 26%; transform: translateY(50%);"></div>

                <div class="track-wall inner-wall"></div>
                <div id="overlays-layer"></div>
            </div>
        </div>
    </div>

    <script>
        function init() {
            updateClock(); setInterval(updateClock, 1000); switchMode('open'); 
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = 
                `🕒 ${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ` + 
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        let currentMode = 'open'; 

        function toggleSidebar() {
            document.getElementById('mySidebar').classList.toggle('active');
        }

        function resetDraw() {
            document.getElementById('overlays-layer').innerHTML = ''; 
            document.getElementById('result-info').innerHTML = '<div style="text-align: center; color: #777; font-size: 18px; margin-top: 50px;">👆 請點擊上方藍色按鈕進行抽籤...</div>';
        }

        function switchMode(mode) {
            currentMode = mode; resetDraw();
            document.getElementById('tab-open').classList.remove('active');
            document.getElementById('tab-obstacle').classList.remove('active');
            document.getElementById(`tab-${mode}`).classList.add('active');

            const btn = document.getElementById('main-draw-btn');
            const hint = document.getElementById('mode-hint');

            if (mode === 'open') {
                btn.innerHTML = '🎲 執行資格賽 (Open) 抽籤';
                hint.innerHTML = '💡 <strong>資格賽模式：</strong>點擊抽籤結果中的項目文字，地圖上會產生圖示與特效提示！';
            } else {
                btn.innerHTML = '🎲 執行決賽 (Obstacle) 抽籤';
                hint.innerHTML = '💡 <strong>決賽模式：</strong>點擊任一標誌或停車場文字，地圖會即時發光定位該目標。';
            }
        }

        const tossCoin = () => Math.random() < 0.5 ? "Heads" : "Tails";
        const getSectionInfo = () => {
            const t1 = tossCoin(), t2 = tossCoin();
            if (t1==="Heads" && t2==="Heads") return { id: "Top", name: "上方區 (Top)" };
            if (t1==="Heads" && t2==="Tails") return { id: "Right", name: "右側區 (Right)" };
            if (t1==="Tails" && t2==="Heads") return { id: "Left", name: "左側區 (Left)" };
            return { id: "Bottom", name: "下方區 (Bottom)" };
        };

        const CARD_LAYOUTS = {
            5: [["p1","Red","Inner"],["p3","Red","Outer"]], 6: [["p1","Green","Inner"],["p3","Red","Outer"]],
            7: [["p1","Red","Outer"],["p3","Red","Inner"]], 8: [["p1","Green","Outer"],["p3","Red","Inner"]],
            9: [["p1","Red","Inner"],["p3","Red","Inner"]], 10: [["p1","Green","Inner"],["p3","Red","Inner"]],
            11: [["p1","Red","Outer"],["p3","Red","Outer"]], 12: [["p1","Green","Outer"],["p3","Red","Outer"]],
            13: [["p1","Red","Inner"],["p3","Green","Outer"]], 14: [["p1","Green","Inner"],["p3","Green","Outer"]],
            15: [["p1","Red","Outer"],["p3","Green","Inner"]], 16: [["p1","Green","Outer"],["p3","Green","Inner"]],
            17: [["p1","Red","Inner"],["p3","Green","Inner"]], 18: [["p1","Green","Inner"],["p3","Green","Inner"]],
            19: [["p1","Red","Outer"],["p3","Green","Outer"]], 20: [["p1","Green","Outer"],["p3","Green","Outer"]]
        };

        const POS_MAP = {
            "Top": { "p1": [34, "X"], "p2": [50, "X"], "p3": [66, "X"], "Inner": 22, "Outer": 14 },
            "Right": { "p1": [34, "Y"], "p2": [50, "Y"], "p3": [66, "Y"], "Inner": 78, "Outer": 86 },
            "Bottom": { "p1": [66, "X"], "p2": [50, "X"], "p3": [34, "X"], "Inner": 78, "Outer": 86 },
            "Left": { "p1": [66, "Y"], "p2": [50, "Y"], "p3": [34, "Y"], "Inner": 22, "Outer": 14 }
        };

        const OPEN_GRID_COORDS = {
            "Top": { 1: [34, 23], 2: [66, 23], 3: [34, 18], 4: [66, 18], 5: [34, 13], 6: [66, 13] },
            "Right": { 1: [77, 34], 2: [77, 66], 3: [82, 34], 4: [82, 66], 5: [87, 34], 6: [87, 66] },
            "Bottom": { 1: [66, 77], 2: [34, 77], 3: [66, 82], 4: [34, 82], 5: [66, 87], 6: [34, 87] },
            "Left": { 1: [23, 66], 2: [23, 34], 3: [18, 66], 4: [18, 34], 5: [13, 66], 6: [13, 34] }
        };

        function triggerHighlightAt(leftPercent, topPercent) {
            const mapContainer = document.getElementById('map-container');
            const ripple = document.createElement('div');
            ripple.className = 'highlight-ripple';
            ripple.style.left = `${leftPercent}%`;
            ripple.style.top = `${topPercent}%`;
            mapContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }

        function addPillar(secId, pos, color, row, hasParking) {
            const actualRow = hasParking ? "Inner" : row; 
            const pInfo = POS_MAP[secId];
            const coordBase = pInfo[pos];
            const axis = coordBase[1];
            const pValue = coordBase[0];
            const rValue = pInfo[actualRow];
            
            const el = document.createElement('div');
            el.className = `overlay ${color === "Red" ? "pillar-red" : "pillar-green"}`;
            if (axis === "X") { el.style.left = `${pValue}%`; el.style.top = `${rValue}%`; }
            else { el.style.left = `${rValue}%`; el.style.top = `${pValue}%`; }
            document.getElementById('overlays-layer').appendChild(el);
            return { left: (axis === "X" ? pValue : rValue), top: (axis === "X" ? rValue : pValue) };
        }

        function drawParking(secId, withCar = false) {
            const el = document.createElement('div');
            el.className = 'parking-zone'; 
            if (withCar) {
                el.innerHTML = '<div class="car-in-parking">🚗</div>';
            } else {
                el.innerHTML = '<span style="color:#F702F9; font-weight:900; font-size:24px;">P</span>';
            }
            let coords = {left: 0, top: 0};
            if(secId === "Top") { el.style.left='44%'; el.style.top='10%'; el.style.width='12%'; el.style.height='8%'; coords={left:50, top:14}; }
            if(secId === "Right") { el.style.left='82%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; coords={left:86, top:50}; }
            if(secId === "Bottom") { el.style.left='44%'; el.style.top='82%'; el.style.width='12%'; el.style.height='8%'; coords={left:50, top:86}; }
            if(secId === "Left") { el.style.left='10%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; coords={left:14, top:50}; }
            document.getElementById('overlays-layer').appendChild(el);
            return coords;
        }

        function drawWallBlock(secId, row) {
            const el = document.createElement('div'); el.className = 'wall-block';
            const rValue = POS_MAP[secId][row];
            let coords = {left: 50, top: 50};
            if (secId === "Top" || secId === "Bottom") {
                el.style.top = `calc(${rValue}% - 3%)`; el.style.height = '6%'; el.style.left = '42%'; el.style.width = '16%';
                coords = {left: 50, top: rValue};
            } else {
                el.style.left = `calc(${rValue}% - 3%)`; el.style.width = '6%'; el.style.top = '42%'; el.style.height = '16%';
                coords = {left: rValue, top: 50};
            }
            document.getElementById('overlays-layer').appendChild(el);
            return coords;
        }

        function drawStartGrid(secId, activeZone, isWide) {
            const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6]; 
            validZones.forEach(zoneId => {
                const el = document.createElement('div');
                const isActive = (zoneId === activeZone);
                el.className = `start-zone-marker ${isActive ? 'start-zone-active' : ''}`;
                el.innerHTML = isActive ? '' : zoneId; 
                const xy = OPEN_GRID_COORDS[secId][zoneId];
                el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
                document.getElementById('overlays-layer').appendChild(el);
            });
        }

        function drawStartCar(secId, zoneId) {
            const el = document.createElement('div');
            el.className = 'open-car'; el.innerHTML = "🚗";
            const xy = OPEN_GRID_COORDS[secId][zoneId];
            el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
            document.getElementById('overlays-layer').appendChild(el);
            return { left: xy[0], top: xy[1] };
        }

        function restoreField(fullData) {
            resetDraw();
            const info = document.getElementById('result-info');
            
            if (fullData.type === 'open') {
                switchMode('open');
                const isWide = fullData.isWide;
                const startSec = fullData.startSec;
                const zoneId = fullData.zoneId;
                const isInner = !isWide;
                let wallBlockSecs = ["Top", "Right", "Bottom", "Left"].filter(id => id !== startSec);
                
                wallBlockSecs.forEach(secId => drawWallBlock(secId, isInner ? "Inner" : "Outer"));
                drawStartGrid(startSec, zoneId, isWide);
                drawStartCar(startSec, zoneId);

                const secNameMap = { "Top": "上方區 (Top)", "Right": "右側區 (Right)", "Bottom": "下方區 (Bottom)", "Left": "左側區 (Left)" };

                info.innerHTML = `
                    <h2 class="section-title">🏁 資格賽 (Open) 還原結果</h2>
                    <strong>1. 賽道牆體設置：</strong> ${isWide ? "寬 (Wide)" : "窄 (Narrow)"}<br>
                    <strong>2. 起點區域：</strong> ${secNameMap[startSec]}<br>
                    <strong>3. 起點車輛位置：</strong> 位置 ${zoneId} 🚗
                `;
            } else {
                switchMode('obstacle');
                const pSec = fullData.pSec;
                const sSec = fullData.sSec;
                const singleObj = fullData.singleObj;
                const doubleObjs = fullData.doubleObjs;

                drawParking(pSec, true);
                addPillar(sSec.id, singleObj.pos, singleObj.color, singleObj.lane, (sSec.id === pSec));
                
                doubleObjs.forEach(item => {
                    const hasP = (item.sec === pSec);
                    addPillar(item.sec, item.c1[0], item.c1[1], item.c1[2], hasP);
                    addPillar(item.sec, item.c2[0], item.c2[1], item.c2[2], hasP);
                });

                info.innerHTML = `
                    <h2 class="section-title">🚧 決賽 (Obstacle) 還原結果</h2>
                    <strong>1. 行進方向：</strong> 順時針 (固定)<br>
                    <strong>2. 停車場與起點：</strong> ${pSec} 🚗<br>
                    <strong>3. 單一標誌區：</strong> ${sSec.name}<br>
                    <strong>4. 單一標誌配置：</strong> ${singleObj.color === "Green" ? "綠柱" : "紅柱"} (${singleObj.lane}, ${singleObj.pos})<br>
                    <strong>5. 雙標誌區已完整還原至地圖！</strong>
                `;
            }
            document.getElementById('mySidebar').classList.remove('active');
        }

        function addHistoryRecord(title, summaryHtml, rawData) {
            const historyList = document.getElementById('historyList');
            if (historyList.innerHTML.includes('目前尚無抽籤紀錄')) historyList.innerHTML = '';

            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'history-item';
            
            const jsonStr = encodeURIComponent(JSON.stringify(rawData));

            itemDiv.innerHTML = `
                <div class="history-item-top">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" class="record-checkbox" onclick="event.stopPropagation()">
                        <span class="history-title">${title}</span>
                    </div>
                    <button class="btn-delete-single" onclick="deleteSingleRecord(this)" title="刪除此紀錄">❌</button>
                </div>
                <div class="history-time">🕒 抽籤時間：${now.toLocaleDateString()} ${timeString}</div>
                <div class="history-content">${summaryHtml}</div>
                <div class="history-actions">
                    <button class="btn-restore" onclick="restoreField(JSON.parse(decodeURIComponent('${jsonStr}')))">🔄 還原整個場地</button>
                    <div>
                        <button class="btn-mark-success" onclick="markRecordStatus(this, 'success')">✅ 正常</button>
                        <button class="btn-mark-fail" onclick="markRecordStatus(this, 'fail')">❌ 失敗</button>
                    </div>
                </div>
            `;
            historyList.prepend(itemDiv);
        }

        function toggleSelectAll(selectAllBtn) {
            const checkboxes = document.querySelectorAll('.record-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAllBtn.checked);
        }

        function deleteSingleRecord(btn) {
            const card = btn.closest('.history-item');
            card.remove();
            checkEmptyHistory();
        }

        function deleteSelectedRecords() {
            const checkedBoxes = document.querySelectorAll('.record-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('請先勾選想要刪除的紀錄！');
                return;
            }
            if (confirm(`確定要刪除選取的 ${checkedBoxes.length} 筆紀錄嗎？`)) {
                checkedBoxes.forEach(cb => cb.closest('.history-item').remove());
                document.getElementById('selectAllCheckbox').checked = false;
                checkEmptyHistory();
            }
        }

        function checkEmptyHistory() {
            const historyList = document.getElementById('historyList');
            if (!historyList.querySelector('.history-item')) {
                historyList.innerHTML = '<div style="text-align: center; color: #777; margin-top: 40px; font-size: 14px;">目前尚無抽籤紀錄，請點擊畫面上的按鈕開始抽籤！</div>';
            }
        }

        function markRecordStatus(btnElement, status) {
            const card = btnElement.closest('.history-item');
            card.classList.remove('success', 'fail');
            card.classList.add(status);
        }

        function runDraw() {
            resetDraw();
            const info = document.getElementById('result-info');
            let html = `<h2 class="section-title">${currentMode === 'open' ? '🏁 資格賽 (Open) 抽籤結果' : '🚧 決賽 (Obstacle) 抽籤結果'}</h2>`;

            if (currentMode === 'open') {
                const isWide = tossCoin() === "Heads";
                const startSec = getSectionInfo();
                const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6];
                const zoneId = validZones[Math.floor(Math.random() * validZones.length)];
                
                let wallBlockSecs = ["Top", "Right", "Bottom", "Left"].filter(id => id !== startSec.id);
                const isInner = !isWide; 
                
                wallBlockSecs.forEach(secId => drawWallBlock(secId, isInner ? "Inner" : "Outer"));
                drawStartGrid(startSec.id, zoneId, isWide);
                const carXY = drawStartCar(startSec.id, zoneId);

                html += `<strong>1. 賽道牆體設置：</strong> <span class="interactive-text" onclick="triggerHighlightAt(50, 22)">${isWide ? "寬 (Wide)" : "窄 (Narrow)"}</span><br>`;
                html += `<strong>2. 起點區域：</strong> <span class="interactive-text" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">${startSec.name}</span><br>`;
                html += `<strong>3. 起點車輛位置：</strong> ➔ <span class="interactive-text" style="color:#ff3300; background:rgba(255,51,0,0.12);" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">位置 ${zoneId} 🚗</span><br>`;

                const summaryHtml = `牆體: ${isWide ? "寬" : "窄"}<br>起點區: ${startSec.name}<br>起點格: 位置 ${zoneId}`;
                const rawData = { type: 'open', isWide, startSec: startSec.id, zoneId };
                addHistoryRecord('🏁 資格賽場地紀錄', summaryHtml, rawData);

            } else {
                const s = getSectionInfo(); 
                const p = getSectionInfo(); 
                const config = { single_sign_section: s.id, parking_section: p.id };
                
                const parkingXY = drawParking(config.parking_section, true);

                html += `<strong>1. 行進方向：</strong> <span class="interactive-text">順時針 (固定)</span><br>`;
                html += `<strong>2. 停車場與起點：</strong> <span class="interactive-text" style="color:#F702F9; background:rgba(247,2,249,0.12);" onclick="triggerHighlightAt(${parkingXY.left}, ${parkingXY.top})">${p.name} 🚗</span><br>`;
                html += `<strong>3. 單一標誌區：</strong> <span class="interactive-text" onclick="triggerHighlightAt(50, 50)">${s.name}</span><br><br>`;
                
                const singlePositions = ["p1", "p2", "p3"];
                const sPos = singlePositions[Math.floor(Math.random() * 3)];
                const sColor = Math.random() < 0.5 ? "Green" : "Red";
                const sLane = Math.random() < 0.5 ? "Inner" : "Outer";
                
                const singlePillarCoord = addPillar(s.id, sPos, sColor, sLane, (s.id === p.id));
                const singleObj = { pos: sPos, color: sColor, lane: sLane };

                const sColorName = sColor === "Green" ? "綠柱" : "紅柱";
                const sColorHex = sColor === "Green" ? "#008000" : "#cc0000";
                const sLaneName = sLane === "Inner" ? "內側" : "外側";
                const sPosName = sPos === "p1" ? "前段" : sPos === "p2" ? "中段" : "後段";
                
                html += `<strong>4. 單一標誌配置：</strong><br>`;
                html += `&nbsp;&nbsp;➔ <span class="interactive-text" style="color:${sColorHex};" onclick="triggerHighlightAt(${singlePillarCoord.left}, ${singlePillarCoord.top})">${sColorName} (${sLaneName}, ${sPosName})</span><br><br>`;
                
                html += `<strong>5. 雙標誌區配置：</strong><br>`;
                let doubleDeck = Array.from({length: 16}, (_, i) => i + 5); 
                doubleDeck.sort(() => Math.random() - 0.5);

                let doubleSummary = '';
                let doubleObjs = [];
                const sections = ["Top", "Right", "Bottom", "Left"];
                sections.forEach(secId => {
                    const hasParking = (secId === config.parking_section);
                    if (secId !== config.single_sign_section) {
                        const cardNum = doubleDeck.pop();
                        const data = CARD_LAYOUTS[cardNum];
                        const c1Name = data[0][1] === "Green" ? "綠" : "紅";
                        const c2Name = data[1][1] === "Green" ? "綠" : "紅";
                        
                        addPillar(secId, data[0][0], data[0][1], data[0][2], hasParking);
                        addPillar(secId, data[1][0], data[1][1], data[1][2], hasParking);
                        doubleObjs.push({ sec: secId, cardNum, c1: data[0], c2: data[1] });

                        html += `&nbsp;&nbsp;[${secId}] 卡牌 ${cardNum} ➔ ${c1Name}(${data[0][2]}), ${c2Name}(${data[1][2]})<br>`;
                        doubleSummary += `[${secId}]卡${cardNum} `;
                    }
                });

                const summaryHtml = `停車場: ${p.name}<br>單一標誌: ${s.name} (${sColorName})<br>雙標誌區: ${doubleSummary}`;
                const rawData = { type: 'obstacle', pSec: p.id, sSec: s, singleObj, doubleObjs };
                addHistoryRecord('🚧 決賽場地紀錄', summaryHtml, rawData);
            }
            
            info.innerHTML = html;
        }
    </script>
</body>
</html>
