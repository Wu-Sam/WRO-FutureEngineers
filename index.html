<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO 2026 官方抽籤系統 | Future Engineers (互動圖示版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0f4c81;
            --accent-blue: #0056b3;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: var(--bg-gradient); 
            color: #333; margin: 0; padding: 30px 20px; 
            min-height: 100vh;
        }

        h1 { 
            color: var(--primary-color); font-size: 32px; font-weight: 900;
            text-align: center; margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }
        
        #realtime-clock {
            position: fixed; top: 20px; left: 20px; font-size: 15px; font-weight: 700;
            color: var(--primary-color); background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px); padding: 10px 20px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 1000;
        }

        /* 側邊欄按鈕 */
        .toggle-sidebar-btn {
            position: fixed; top: 20px; right: 20px;
            background: linear-gradient(135deg, #2196F3, #0b7dda);
            color: white; padding: 10px 20px; border-radius: 50px;
            border: none; font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 1000;
            transition: all 0.3s;
        }
        .toggle-sidebar-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(33,150,243,0.3); }

        /* 側邊欄 */
        .sidebar {
            position: fixed; top: 0; right: -420px; width: 380px; height: 100vh;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            box-shadow: -5px 0 25px rgba(0,0,0,0.15); transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1001; padding: 25px; box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;
        }
        .sidebar-header h2 { margin: 0; color: var(--primary-color); font-size: 20px; }

        .close-btn { background: transparent; color: #999; font-size: 28px; border: none; cursor: pointer; padding: 0; line-height: 1; }
        .close-btn:hover { color: #333; }

        /* 歷史紀錄卡片 */
        .history-item {
            background: #fff; border-left: 5px solid #2196F3; padding: 15px;
            margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 14px; line-height: 1.6;
        }
        .history-item.fail { border-left-color: #f44336; }
        .history-item.success { border-left-color: #4CAF50; }

        .history-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: var(--primary-color); }
        .history-time { font-size: 12px; color: #888; margin-bottom: 8px; }
        .history-content { background: #f9f9f9; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
        
        .history-actions { display: flex; gap: 8px; }
        .history-actions button { padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-mark-success { background: #e8f5e9; color: #2e7d32; }
        .btn-mark-fail { background: #ffebee; color: #c62828; }

        /* 互動提示文字樣式 (讓文字可以點擊並有特效) */
        .interactive-text {
            display: inline-block;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(33, 150, 243, 0.1);
            color: #0d47a1;
            font-weight: bold;
            transition: all 0.2s;
            border: 1px dashed #2196F3;
        }
        .interactive-text:hover {
            background: rgba(33, 150, 243, 0.25);
            transform: scale(1.03);
        }

        /* 模式切換 */
        .tab-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            font-family: 'Noto Sans TC', sans-serif; font-size: 18px; 
            padding: 12px 35px; border-radius: 50px; background-color: white; 
            color: #666; font-weight: 700; cursor: pointer; 
            transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: none;
        }
        .tab-btn:hover { color: var(--accent-blue); transform: translateY(-2px); }
        .tab-btn.active { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: #fff; box-shadow: 0 8px 20px rgba(30, 60, 114, 0.4); 
        }

        /* 控制區 */
        .controls { 
            text-align: center; margin-bottom: 30px; padding: 25px; 
            background: var(--panel-bg); border-radius: 16px; 
            box-shadow: var(--shadow-soft); max-width: 800px; margin: 0 auto;
        }
        .btn-group { display: flex; justify-content: center; gap: 20px; } 
        button.draw-btn { 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            color: white; font-weight: 700; font-size: 18px; 
            padding: 14px 30px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s;
        }
        button.draw-btn:hover { transform: translateY(-3px) scale(1.02); }
        button.reset-btn { 
            background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%); 
            color: white; font-weight: 700; font-size: 18px; 
            padding: 14px 30px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s;
        }
        button.reset-btn:hover { transform: translateY(-3px) scale(1.02); }
        
        #mode-hint { margin-top: 15px; font-size: 15px; color: #555; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; display: inline-block;}

        /* 主內容區 */
        .main-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 1300px; margin: 0 auto;}
        
        .info-panel { 
            flex: 1; min-width: 340px; max-width: 420px; 
            background: var(--panel-bg); padding: 30px; 
            border-radius: 16px; line-height: 2.2; 
            box-shadow: var(--shadow-soft); border-top: 6px solid var(--primary-color); 
            font-size: 16px; 
        }
        .section-title { 
            font-weight: 900; color: var(--primary-color); 
            margin-top: 0; margin-bottom: 20px; font-size: 22px; 
            border-bottom: 2px dashed #ccc; padding-bottom: 12px; 
        }
        
        .map-panel { 
            flex: 2; min-width: 500px; max-width: 800px; 
            background: var(--panel-bg); padding: 25px; 
            border-radius: 16px; box-shadow: var(--shadow-soft); 
            display: flex; justify-content: center; align-items: center; 
        }
        
        /* 賽道底板 */
        .map-container { 
            position: relative; width: 100%; max-width: 700px; aspect-ratio: 1 / 1; 
            background-color: #fafafa; 
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 20px 20px; overflow: hidden; border-radius: 12px; border: 2px solid #ddd;
        }
        
        .track-wall { position: absolute; box-sizing: border-box; }
        .outer-wall { 
            top: 10%; bottom: 10%; left: 10%; right: 10%; 
            border: 8px solid #2b2b2b; border-radius: 12%; 
            background-color: #3b3b3b; z-index: 1; 
        }
        .center-line { 
            top: 18%; bottom: 18%; left: 18%; right: 18%; 
            border: 3px dashed rgba(255, 255, 255, 0.6); border-radius: 8%; z-index: 2; 
        }
        .inner-wall { 
            top: 26%; bottom: 26%; left: 26%; right: 26%; 
            border: 8px solid #2b2b2b; border-radius: 4%; 
            background-color: #fafafa; 
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 20px 20px; z-index: 4; 
        }

        .boundary-line { position: absolute; z-index: 3;}
        .line-v-blue { width: 6px; height: 16.5%; background-color: #0066cc; }
        .line-h-orange { height: 6px; width: 16.5%; background-color: #ff6600; }
        
        /* 視覺化元素 */
        .overlay { 
            position: absolute; transform: translate(-50%, -50%); 
            width: 4%; aspect-ratio: 1 / 1; border-radius: 50%; z-index: 10; border: 2px solid #fff; 
        }
        .pillar-red { background: radial-gradient(circle at 30% 30%, #ff4b4b, #cc0000); }
        .pillar-green { background: radial-gradient(circle at 30% 30%, #32cd32, #008000); }
        
        /* 停車場 */
        .parking-zone { 
            position: absolute; border: 3px dashed #F702F9; 
            background-color: rgba(247, 2, 249, 0.15); z-index: 5; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 6px; box-shadow: inset 0 0 10px rgba(247, 2, 249, 0.2);
        }
        .car-in-parking {
            font-size: 34px; animation: float-car 1.5s infinite alternate ease-in-out;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
        }
        @keyframes float-car {
            from { transform: translateY(-2px); }
            to { transform: translateY(2px); }
        }

        .start-zone-marker {
            position: absolute; transform: translate(-50%, -50%); z-index: 4;
            border: 2px dashed #999; background-color: rgba(255, 255, 255, 0.6);
            width: 7%; aspect-ratio: 1 / 1; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold; color: #888;
        }
        .start-zone-active { 
            border: 3px solid #ff3300; background-color: rgba(255, 51, 0, 0.2); 
            z-index: 5; box-shadow: 0 0 15px rgba(255, 51, 0, 0.6);
            transform: translate(-50%, -50%) scale(1.1);
        }
        .wall-block {
            position: absolute; z-index: 6; border: 2px solid #111; border-radius: 3px;
            background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 12px, #222 12px, #222 24px);
        }
        .open-car {
            position: absolute; transform: translate(-50%, -50%); z-index: 15;
            font-size: 36px; filter: drop-shadow(2px 5px 8px rgba(0,0,0,0.5));
            animation: bounce-drop 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        @keyframes bounce-drop {
            0% { transform: translate(-50%, -150%) scale(1.3); opacity: 0; }
            70% { transform: translate(-50%, -40%) scale(0.9); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* 點擊瞬間的高亮特效圓圈 */
        .highlight-ripple {
            position: absolute; transform: translate(-50%, -50%);
            width: 50px; height: 50px; border-radius: 50%;
            border: 3px solid #ffeb3b; background: rgba(255, 235, 59, 0.4);
            z-index: 25; animation: ripple-effect 0.8s ease-out forwards;
        }
        @keyframes ripple-effect {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
        }
    </style>
</head>
<body onload="init()">

    <div id="realtime-clock">讀取時間中...</div>

    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">📜 開啟歷史紀錄</button>

    <div class="sidebar" id="mySidebar">
        <div class="sidebar-header">
            <h2>抽籤與供貨歷史紀錄</h2>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <div id="historyList">
            <div style="text-align: center; color: #888; margin-top: 40px; font-size: 14px;">目前尚無抽籤紀錄，請點擊畫面上的按鈕開始抽籤！</div>
        </div>
    </div>

    <h1>WRO 2026 未來工程師 (官方抽籤系統)</h1>

    <div class="tab-container">
        <button id="tab-open" class="tab-btn active" onclick="switchMode('open')">🏁 資格賽 (Open Challenge)</button>
        <button id="tab-obstacle" class="tab-btn" onclick="switchMode('obstacle')">🚧 決賽 (Obstacle Challenge)</button>
    </div>
    
    <div class="controls">
        <div class="btn-group">
            <button class="draw-btn" id="main-draw-btn" onclick="runDraw()">🎲 執行資格賽抽籤</button>
            <button class="reset-btn" onclick="resetDraw()">🔄 重設畫面</button>
        </div>
        <div id="mode-hint">💡 <strong>資格賽模式：</strong>抽出牆體寬窄與 1-6 號起點格 (點擊文字可突顯對應圖示)。</div>
    </div>

    <div class="main-container">
        <div class="info-panel" id="result-info">
            <div style="text-align: center; color: #888; font-size: 18px; margin-top: 50px;">👆 請點擊上方綠色按鈕進行抽籤...</div>
        </div>

        <div class="map-panel">
            <div class="map-container" id="map-container">
                <div class="track-wall outer-wall"></div>
                <div class="track-wall center-line"></div>
                
                <div class="boundary-line line-v-blue" style="top: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="top: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; bottom: 26%; transform: translateY(50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; bottom: 26%; transform: translateY(50%);"></div>

                <div class="track-wall inner-wall"></div>
                <div id="overlays-layer"></div>
            </div>
        </div>
    </div>

    <script>
        function init() {
            updateClock(); setInterval(updateClock, 1000); switchMode('open'); 
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = 
                `🕒 ${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ` + 
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        let currentMode = 'open'; 

        function toggleSidebar() {
            document.getElementById('mySidebar').classList.toggle('active');
        }

        function resetDraw() {
            document.getElementById('overlays-layer').innerHTML = ''; 
            document.getElementById('result-info').innerHTML = '<div style="text-align: center; color: #888; font-size: 18px; margin-top: 50px;">👆 請點擊上方綠色按鈕進行抽籤...</div>';
        }

        function switchMode(mode) {
            currentMode = mode; resetDraw();
            document.getElementById('tab-open').classList.remove('active');
            document.getElementById('tab-obstacle').classList.remove('active');
            document.getElementById(`tab-${mode}`).classList.add('active');

            const btn = document.getElementById('main-draw-btn');
            const hint = document.getElementById('mode-hint');

            if (mode === 'open') {
                btn.innerHTML = '🎲 執行資格賽 (Open) 抽籤';
                hint.innerHTML = '💡 <strong>資格賽模式：</strong>點擊抽籤結果中的項目文字，地圖上會產生圖示與特效提示！';
            } else {
                btn.innerHTML = '🎲 執行決賽 (Obstacle) 抽籤';
                hint.innerHTML = '💡 <strong>決賽模式：</strong>點擊任一標誌或停車場文字，地圖會即時發光定位該目標。';
            }
        }

        const tossCoin = () => Math.random() < 0.5 ? "Heads" : "Tails";
        const getSectionInfo = () => {
            const t1 = tossCoin(), t2 = tossCoin();
            if (t1==="Heads" && t2==="Heads") return { id: "Top", name: "上方區 (Top)" };
            if (t1==="Heads" && t2==="Tails") return { id: "Right", name: "右側區 (Right)" };
            if (t1==="Tails" && t2==="Heads") return { id: "Left", name: "左側區 (Left)" };
            return { id: "Bottom", name: "下方區 (Bottom)" };
        };

        const CARD_LAYOUTS = {
            5: [["p1","Red","Inner"],["p3","Red","Outer"]], 6: [["p1","Green","Inner"],["p3","Red","Outer"]],
            7: [["p1","Red","Outer"],["p3","Red","Inner"]], 8: [["p1","Green","Outer"],["p3","Red","Inner"]],
            9: [["p1","Red","Inner"],["p3","Red","Inner"]], 10: [["p1","Green","Inner"],["p3","Red","Inner"]],
            11: [["p1","Red","Outer"],["p3","Red","Outer"]], 12: [["p1","Green","Outer"],["p3","Red","Outer"]],
            13: [["p1","Red","Inner"],["p3","Green","Outer"]], 14: [["p1","Green","Inner"],["p3","Green","Outer"]],
            15: [["p1","Red","Outer"],["p3","Green","Inner"]], 16: [["p1","Green","Outer"],["p3","Green","Inner"]],
            17: [["p1","Red","Inner"],["p3","Green","Inner"]], 18: [["p1","Green","Inner"],["p3","Green","Inner"]],
            19: [["p1","Red","Outer"],["p3","Green","Outer"]], 20: [["p1","Green","Outer"],["p3","Green","Outer"]]
        };

        const POS_MAP = {
            "Top": { "p1": [34, "X"], "p2": [50, "X"], "p3": [66, "X"], "Inner": 22, "Outer": 14 },
            "Right": { "p1": [34, "Y"], "p2": [50, "Y"], "p3": [66, "Y"], "Inner": 78, "Outer": 86 },
            "Bottom": { "p1": [66, "X"], "p2": [50, "X"], "p3": [34, "X"], "Inner": 78, "Outer": 86 },
            "Left": { "p1": [66, "Y"], "p2": [50, "Y"], "p3": [34, "Y"], "Inner": 22, "Outer": 14 }
        };

        const OPEN_GRID_COORDS = {
            "Top": { 1: [34, 23], 2: [66, 23], 3: [34, 18], 4: [66, 18], 5: [34, 13], 6: [66, 13] },
            "Right": { 1: [77, 34], 2: [77, 66], 3: [82, 34], 4: [82, 66], 5: [87, 34], 6: [87, 66] },
            "Bottom": { 1: [66, 77], 2: [34, 77], 3: [66, 82], 4: [34, 82], 5: [66, 87], 6: [34, 87] },
            "Left": { 1: [23, 66], 2: [23, 34], 3: [18, 66], 4: [18, 34], 5: [13, 66], 6: [13, 34] }
        };

        // 點擊瞬間的高亮特效圓圈
        function triggerHighlightAt(leftPercent, topPercent) {
            const mapContainer = document.getElementById('map-container');
            const ripple = document.createElement('div');
            ripple.className = 'highlight-ripple';
            ripple.style.left = `${leftPercent}%`;
            ripple.style.top = `${topPercent}%`;
            mapContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }

        function addPillar(secId, pos, color, row, hasParking) {
            const actualRow = hasParking ? "Inner" : row; 
            const pInfo = POS_MAP[secId];
            const coordBase = pInfo[pos];
            const axis = coordBase[1];
            const pValue = coordBase[0];
            const rValue = pInfo[actualRow];
            
            const el = document.createElement('div');
            el.className = `overlay ${color === "Red" ? "pillar-red" : "pillar-green"}`;
            if (axis === "X") { el.style.left = `${pValue}%`; el.style.top = `${rValue}%`; }
            else { el.style.left = `${rValue}%`; el.style.top = `${pValue}%`; }
            document.getElementById('overlays-layer').appendChild(el);
            return { left: (axis === "X" ? pValue : rValue), top: (axis === "X" ? rValue : pValue) };
        }

        function drawParking(secId, withCar = false) {
            const el = document.createElement('div');
            el.className = 'parking-zone'; 
            if (withCar) {
                el.innerHTML = '<div class="car-in-parking">🚗</div>';
            } else {
                el.innerHTML = '<span style="color:#F702F9; font-weight:900; font-size:24px;">P</span>';
            }
            let coords = {left: 0, top: 0};
            if(secId === "Top") { el.style.left='44%'; el.style.top='10%'; el.style.width='12%'; el.style.height='8%'; coords={left:50, top:14}; }
            if(secId === "Right") { el.style.left='82%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; coords={left:86, top:50}; }
            if(secId === "Bottom") { el.style.left='44%'; el.style.top='82%'; el.style.width='12%'; el.style.height='8%'; coords={left:50, top:86}; }
            if(secId === "Left") { el.style.left='10%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; coords={left:14, top:50}; }
            document.getElementById('overlays-layer').appendChild(el);
            return coords;
        }

        function drawWallBlock(secId, row) {
            const el = document.createElement('div'); el.className = 'wall-block';
            const rValue = POS_MAP[secId][row];
            let coords = {left: 50, top: 50};
            if (secId === "Top" || secId === "Bottom") {
                el.style.top = `calc(${rValue}% - 3%)`; el.style.height = '6%'; el.style.left = '42%'; el.style.width = '16%';
                coords = {left: 50, top: rValue};
            } else {
                el.style.left = `calc(${rValue}% - 3%)`; el.style.width = '6%'; el.style.top = '42%'; el.style.height = '16%';
                coords = {left: rValue, top: 50};
            }
            document.getElementById('overlays-layer').appendChild(el);
            return coords;
        }

        function drawStartGrid(secId, activeZone, isWide) {
            const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6]; 
            validZones.forEach(zoneId => {
                const el = document.createElement('div');
                const isActive = (zoneId === activeZone);
                el.className = `start-zone-marker ${isActive ? 'start-zone-active' : ''}`;
                el.innerHTML = isActive ? '' : zoneId; 
                const xy = OPEN_GRID_COORDS[secId][zoneId];
                el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
                document.getElementById('overlays-layer').appendChild(el);
            });
        }

        function drawStartCar(secId, zoneId) {
            const el = document.createElement('div');
            el.className = 'open-car'; el.innerHTML = "🚗";
            const xy = OPEN_GRID_COORDS[secId][zoneId];
            el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
            document.getElementById('overlays-layer').appendChild(el);
            return { left: xy[0], top: xy[1] };
        }

        function addHistoryRecord(title, summaryText, clickActionHtml) {
            const historyList = document.getElementById('historyList');
            if (historyList.innerHTML.includes('目前尚無抽籤紀錄')) historyList.innerHTML = '';

            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'history-item';
            itemDiv.innerHTML = `
                <div class="history-title">${title}</div>
                <div class="history-time">🕒 抽籤時間：${now.toLocaleDateString()} ${timeString}</div>
                <div class="history-content">${summaryText}</div>
                <div class="history-actions">
                    <button class="btn-mark-success" onclick="markRecordStatus(this, 'success')">✅ 狀態正常</button>
                    <button class="btn-mark-fail" onclick="markRecordStatus(this, 'fail')">❌ 供貨失敗/有問題</button>
                </div>
            `;
            historyList.prepend(itemDiv);
        }

        function markRecordStatus(btnElement, status) {
            const card = btnElement.closest('.history-item');
            card.classList.remove('success', 'fail');
            card.classList.add(status);
        }

        function runDraw() {
            resetDraw();
            const info = document.getElementById('result-info');
            let html = `<h2 class="section-title">${currentMode === 'open' ? '🏁 資格賽 (Open) 抽籤結果' : '🚧 決賽 (Obstacle) 抽籤結果'}</h2>`;
            let summaryText = '';

            if (currentMode === 'open') {
                const isWide = tossCoin() === "Heads";
                const startSec = getSectionInfo();
                const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6];
                const zoneId = validZones[Math.floor(Math.random() * validZones.length)];
                
                let wallBlockSecs = ["Top", "Right", "Bottom", "Left"].filter(id => id !== startSec.id);
                const isInner = !isWide; 
                
                let blockCoordsMap = {};
                wallBlockSecs.forEach(secId => {
                    blockCoordsMap[secId] = drawWallBlock(secId, isInner ? "Inner" : "Outer");
                });
                
                drawStartGrid(startSec.id, zoneId, isWide);
                const carXY = drawStartCar(startSec.id, zoneId);

                html += `<strong>1. 賽道牆體設置：</strong> <span class="interactive-text" onclick="triggerHighlightAt(50, 22)">${isWide ? "寬 (Wide)" : "窄 (Narrow)"}</span><br>`;
                html += `<strong>2. 起點區域：</strong> <span class="interactive-text" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">${startSec.name}</span><br>`;
                html += `<strong>3. 起點車輛位置：</strong> ➔ <span class="interactive-text" style="color:#ff3300; background:#fff0eb;" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">位置 ${zoneId} 🚗</span><br>`;

                summaryText = `<strong>資格賽</strong><br>` +
                              `牆體: <span class="interactive-text" onclick="triggerHighlightAt(50, 22)">${isWide ? "寬" : "窄"}</span><br>` +
                              `起點區: <span class="interactive-text" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">${startSec.name}</span><br>` +
                              `起點格: <span class="interactive-text" style="color:#ff3300;" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">位置 ${zoneId}</span>`;
                addHistoryRecord('🏁 資格賽抽籤', summaryText);

            } else {
                const s = getSectionInfo(); 
                const p = getSectionInfo(); 
                const config = { single_sign_section: s.id, parking_section: p.id };
                
                const parkingXY = drawParking(config.parking_section, true);

                html += `<strong>1. 行進方向：</strong> <span class="interactive-text">順時針 (固定)</span><br>`;
                html += `<strong>2. 停車場與起點：</strong> <span class="interactive-text" style="color:#F702F9; background:rgba(247,2,249,0.1);" onclick="triggerHighlightAt(${parkingXY.left}, ${parkingXY.top})">${p.name} 🚗</span><br>`;
                html += `<strong>3. 單一標誌區：</strong> <span class="interactive-text" onclick="triggerHighlightAt(50, 50)">${s.name}</span><br><br>`;
                
                const singlePositions = ["p1", "p2", "p3"];
                const sPos = singlePositions[Math.floor(Math.random() * 3)];
                const sColor = Math.random() < 0.5 ? "Green" : "Red";
                const sLane = Math.random() < 0.5 ? "Inner" : "Outer";
                const singleData = [sPos, sColor, sLane];

                const sColorName = sColor === "Green" ? "綠柱" : "紅柱";
                const sColorHex = sColor === "Green" ? "#008000" : "#cc0000";
                const sLaneName = sLane === "Inner" ? "內側" : "外側";
                const sPosName = sPos === "p1" ? "前段" : sPos === "p2" ? "中段" : "後段";
                const sForceHint = (s.id === p.id && sLane === "Outer") ? " <span style='color:#ff0000; font-size:12px;'>(退至內側)</span>" : "";
                
                const singlePillarCoord = addPillar(s.id, singleData[0], singleData[1], singleData[2], (s.id === p.id));

                html += `<strong>4. 單一標誌配置：</strong><br>`;
                html += `&nbsp;&nbsp;➔ <span class="interactive-text" style="color:${sColorHex};" onclick="triggerHighlightAt(${singlePillarCoord.left}, ${singlePillarCoord.top})">${sColorName} (${sLaneName}, ${sPosName})</span>${sForceHint}<br><br>`;
                
                html += `<strong>5. 雙標誌區配置：</strong><br>`;
                let doubleDeck = Array.from({length: 16}, (_, i) => i + 5); 
                doubleDeck.sort(() => Math.random() - 0.5);

                let doubleSummary = '';
                const sections = ["Top", "Right", "Bottom", "Left"];
                sections.forEach(secId => {
                    const hasParking = (secId === config.parking_section);
                    if (secId === config.single_sign_section) {
                        // 已經畫過單一標誌
                    } else {
                        const cardNum = doubleDeck.pop();
                        const data = CARD_LAYOUTS[cardNum];
                        const c1Name = data[0][1] === "Green" ? "綠" : "紅";
                        const c2Name = data[1][1] === "Green" ? "綠" : "紅";
                        
                        const pCoord1 = addPillar(secId, data[0][0], data[0][1], data[0][2], hasParking);
                        const pCoord2 = addPillar(secId, data[1][0], data[1][1], data[1][2], hasParking);

                        html += `&nbsp;&nbsp;[${secId}] 卡牌 ${cardNum} ➔ <span class="interactive-text" onclick="triggerHighlightAt(${pCoord1.left}, ${pCoord1.top})">${c1Name}(${data[0][2]})</span>, <span class="interactive-text" onclick="triggerHighlightAt(${pCoord2.left}, ${pCoord2.top})">${c2Name}(${data[1][2]})</span><br>`;
                        
                        doubleSummary += `[${secId}]卡${cardNum} `;
                    }
                });

                summaryText = `<strong>決賽</strong><br>` +
                              `停車場: <span class="interactive-text" style="color:#F702F9;" onclick="triggerHighlightAt(${parkingXY.left}, ${parkingXY.top})">${p.name}</span><br>` +
                              `單一標誌: <span class="interactive-text" style="color:${sColorHex};" onclick="triggerHighlightAt(${singlePillarCoord.left}, ${singlePillarCoord.top})">${s.name} (${sColorName})</span><br>` +
                              `雙標誌區: ${doubleSummary}`;
                addHistoryRecord('🚧 決賽抽籤', summaryText);
            }
            
            info.innerHTML = html;
        }
    </script>
</body>
</html>
