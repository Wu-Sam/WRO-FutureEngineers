<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO 2026 官方抽籤系統 | Future Engineers (精簡清爽版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0f4c81;
            --accent-blue: #0072ff;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b, #0072ff);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: #2c3e50; margin: 0; padding: 10px; 
            min-height: 100vh; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 { 
            color: #ffffff; font-size: 20px; font-weight: 900;
            text-align: center; margin: 35px 0 12px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }
        
        #realtime-clock {
            position: fixed; top: 8px; left: 8px; font-size: 11px; font-weight: 700;
            color: #fff; background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 20px; 
            z-index: 1000;
        }

        .toggle-sidebar-btn {
            position: fixed; top: 8px; right: 8px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white; padding: 6px 12px; border-radius: 20px;
            border: none; font-size: 12px; font-weight: 700; cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 114, 255, 0.4); z-index: 1000;
        }

        .sidebar {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 340px; height: 100vh;
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px);
            box-shadow: -5px 0 25px rgba(0,0,0,0.2); 
            transition: right 0.3s ease;
            z-index: 1001; padding: 15px; box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 8px; margin-bottom: 10px;
        }
        .sidebar-header h2 { margin: 0; color: var(--primary-color); font-size: 16px; font-weight: 900; }
        .close-btn { background: transparent; color: #777; font-size: 24px; border: none; cursor: pointer; padding: 0; line-height: 1; }

        .history-tools {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; font-size: 11px; font-weight: 700; color: #555;
            background: rgba(0,0,0,0.04); padding: 6px 8px; border-radius: 6px;
        }
        .history-tools button {
            background: #ff4757; color: white; border: none; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 700;
        }

        .history-item {
            background: #fff; border-left: 3px solid #0072ff; padding: 8px 10px;
            margin-bottom: 8px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-size: 11px; line-height: 1.4; border-top: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee;
        }
        .history-item.fail { border-left-color: #ff4757; }
        .history-item.success { border-left-color: #2ed573; }

        .history-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .history-title { font-size: 12px; font-weight: 900; color: var(--primary-color); }
        .history-time { font-size: 9px; color: #888; margin-bottom: 4px; }
        .history-content { background: #f8f9fa; padding: 6px; border-radius: 4px; margin-bottom: 6px; }
        
        .history-actions { display: flex; justify-content: space-between; align-items: center; }
        .history-actions div { display: flex; gap: 3px; }
        .history-actions button { padding: 3px 6px; font-size: 10px; border-radius: 4px; border: none; cursor: pointer; font-weight: 700; }
        .btn-restore { background: #e1f5fe; color: #0288d1; }
        .btn-mark-success { background: #e8f5e9; color: #2e7d32; }
        .btn-mark-fail { background: #ffebee; color: #c62828; }
        .btn-delete-single { background: #f1f2f6; color: #ff4757; font-size: 12px; padding: 0 4px; }

        .interactive-text {
            display: inline-block; cursor: pointer; padding: 1px 4px; border-radius: 3px;
            background: rgba(0, 114, 255, 0.08); color: #0056b3; font-weight: 700;
            border: 1px dashed rgba(0, 114, 255, 0.3); margin: 1px 0;
        }

        .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .tab-btn { 
            font-family: 'Noto Sans TC', sans-serif; font-size: 13px; 
            padding: 7px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.15); 
            color: #fff; font-weight: 700; cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.2); transition: 0.2s;
        }
        .tab-btn.active { 
            background: #ffffff; color: var(--primary-color); 
            border-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .controls { 
            text-align: center; margin-bottom: 12px; padding: 12px; 
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border-radius: 12px; border: 1px solid var(--panel-border);
            max-width: 650px; margin-left: auto; margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-group { display: flex; justify-content: center; gap: 8px; } 
        button.draw-btn, button.reset-btn { 
            font-family: 'Noto Sans TC', sans-serif;
            color: white; font-weight: 700; font-size: 13px; 
            padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; 
            transition: 0.2s; flex: 1; max-width: 180px;
        }
        button.draw-btn { background: linear-gradient(135deg, #0072ff, #00c6ff); }
        button.reset-btn { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        
        #mode-hint { margin-top: 6px; font-size: 11px; color: #555; }

        .main-container { display: flex; flex-direction: column; gap: 10px; max-width: 900px; margin: 0 auto;}
        @media (min-width: 768px) {
            .main-container { flex-direction: row; align-items: flex-start; justify-content: center; }
        }
        
        .info-panel { 
            width: 100%; background: var(--panel-bg); backdrop-filter: blur(10px);
            padding: 12px 15px; border-radius: 12px; line-height: 1.6; 
            border: 1px solid var(--panel-border); border-top: 4px solid var(--primary-color); 
            font-size: 12.5px; box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        @media (min-width: 768px) {
            .info-panel { width: 300px; flex-shrink: 0; }
        }

        .section-title { 
            font-weight: 900; color: var(--primary-color); 
            margin: 0 0 8px 0; font-size: 15px; 
            border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 6px; 
        }
        
        .map-panel { 
            width: 100%; background: var(--panel-bg); backdrop-filter: blur(10px);
            padding: 10px; border-radius: 12px; border: 1px solid var(--panel-border);
            display: flex; justify-content: center; align-items: center; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        @media (min-width: 768px) {
            .map-panel { width: 420px; flex-shrink: 0; }
        }
        
        .map-container { 
            position: relative; width: 100%; max-width: 380px; aspect-ratio: 1 / 1; 
            background-color: #ffffff; 
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 16px 16px; overflow: hidden; border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.8);
        }
        
        .track-wall { position: absolute; box-sizing: border-box; }
        .outer-wall { top: 10%; bottom: 10%; left: 10%; right: 10%; border: 5px solid #2b2b2b; border-radius: 12%; background-color: #3b3b3b; z-index: 1; }
        .center-line { top: 18%; bottom: 18%; left: 18%; right: 18%; border: 2px dashed rgba(255, 255, 255, 0.65); border-radius: 8%; z-index: 2; }
        .inner-wall { top: 26%; bottom: 26%; left: 26%; right: 26%; border: 5px solid #2b2b2b; border-radius: 4%; background-color: #ffffff; background-image: radial-gradient(#d1d8e0 1px, transparent 1px); background-size: 16px 16px; z-index: 4; }

        .boundary-line { position: absolute; z-index: 3;}
        .line-v-blue { width: 4px; height: 16.5%; background-color: #0066cc; }
        .line-h-orange { height: 4px; width: 16.5%; background-color: #ff6600; }
        
        .overlay { position: absolute; transform: translate(-50%, -50%); width: 5%; aspect-ratio: 1 / 1; border-radius: 50%; z-index: 10; border: 1.5px solid #fff; }
        .pillar-red { background: radial-gradient(circle at 30% 30%, #ff4b4b, #cc0000); }
        .pillar-green { background: radial-gradient(circle at 30% 30%, #32cd32, #008000); }
        
        .parking-zone { position: absolute; border: 2px dashed #F702F9; background-color: rgba(247, 2, 249, 0.1); z-index: 5; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .car-in-parking { font-size: 20px; }

        .start-zone-marker { position: absolute; transform: translate(-50%, -50%); z-index: 4; border: 1.5px dashed #aaa; background-color: rgba(255, 255, 255, 0.85); width: 6.5%; aspect-ratio: 1 / 1; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #666; }
        .start-zone-active { border: 2px solid #ff3300; background-color: rgba(255, 51, 0, 0.2); z-index: 5; transform: translate(-50%, -50%) scale(1.08); }
        .wall-block { position: absolute; z-index: 6; border: 1px solid #111; border-radius: 2px; background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 8px, #222 8px, #222 16px); }
        .open-car { position: absolute; transform: translate(-50%, -50%); z-index: 15; font-size: 24px; }

        .highlight-ripple {
            position: absolute; transform: translate(-50%, -50%);
            width: 35px; height: 35px; border-radius: 50%;
            border: 2px solid #ffe600; background: rgba(255, 230, 0, 0.4);
            z-index: 25; animation: ripple-effect 0.7s ease-out forwards;
        }
        @keyframes ripple-effect {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
        }
    </style>
</head>
<body onload="init()">

    <div id="realtime-clock">--:--:--</div>
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">📜 歷史</button>

    <div class="sidebar" id="mySidebar">
        <div class="sidebar-header">
            <h2>抽籤紀錄</h2>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <div class="history-tools">
            <label><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"> 全選</label>
            <button onclick="deleteSelectedRecords()">🗑️ 刪除勾選</button>
        </div>
        <div id="historyList">
            <div style="text-align: center; color: #777; margin-top: 30px; font-size: 12px;">尚無紀錄</div>
        </div>
    </div>

    <h1>WRO 2026 抽籤系統</h1>

    <div class="tab-container">
        <button id="tab-open" class="tab-btn active" onclick="switchMode('open')">🏁 資格賽</button>
        <button id="tab-obstacle" class="tab-btn" onclick="switchMode('obstacle')">🚧 決賽</button>
    </div>
    
    <div class="controls">
        <div class="btn-group">
            <button class="draw-btn" id="main-draw-btn" onclick="runDraw()">🎲 開始抽籤</button>
            <button class="reset-btn" onclick="resetDraw()">🔄 重設</button>
        </div>
        <div id="mode-hint">💡 點擊文字可在地圖上即時發光定位！</div>
    </div>

    <div class="main-container">
        <div class="info-panel" id="result-info">
            <div style="text-align: center; color: #777; font-size: 13px; margin-top: 20px;">👆 請點擊上方按鈕</div>
        </div>

        <div class="map-panel">
            <div class="map-container" id="map-container">
                <div class="track-wall outer-wall"></div>
                <div class="track-wall center-line"></div>
                
                <div class="boundary-line line-v-blue" style="top: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="top: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; left: 26%; transform: translateX(-50%);"></div>
                <div class="boundary-line line-v-blue" style="bottom: 10%; right: 26%; transform: translateX(50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="left: 10%; bottom: 26%; transform: translateY(50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; top: 26%; transform: translateY(-50%);"></div>
                <div class="boundary-line line-h-orange" style="right: 10%; bottom: 26%; transform: translateY(50%);"></div>

                <div class="track-wall inner-wall"></div>
                <div id="overlays-layer"></div>
            </div>
        </div>
    </div>

    <script>
        function init() { updateClock(); setInterval(updateClock, 1000); switchMode('open'); }
        function updateClock() {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        let currentMode = 'open'; 
        function toggleSidebar() { document.getElementById('mySidebar').classList.toggle('active'); }
        function resetDraw() {
            document.getElementById('overlays-layer').innerHTML = ''; 
            document.getElementById('result-info').innerHTML = '<div style="text-align: center; color: #777; font-size: 13px; margin-top: 20px;">👆 請點擊上方按鈕</div>';
        }

        function switchMode(mode) {
            currentMode = mode; resetDraw();
            document.getElementById('tab-open').classList.remove('active');
            document.getElementById('tab-obstacle').classList.remove('active');
            document.getElementById(`tab-${mode}`).classList.add('active');
            document.getElementById('main-draw-btn').innerHTML = mode === 'open' ? '🎲 資格賽抽籤' : '🎲 決賽抽籤';
        }

        const tossCoin = () => Math.random() < 0.5 ? "Heads" : "Tails";
        const getSectionInfo = () => {
            const t1 = tossCoin(), t2 = tossCoin();
            if (t1==="Heads" && t2==="Heads") return { id: "Top", name: "上方區" };
            if (t1==="Heads" && t2==="Tails") return { id: "Right", name: "右側區" };
            if (t1==="Tails" && t2==="Heads") return { id: "Left", name: "左側區" };
            return { id: "Bottom", name: "下方區" };
        };

        const CARD_LAYOUTS = {
            5: [["p1","Red","Inner"],["p3","Red","Outer"]], 6: [["p1","Green","Inner"],["p3","Red","Outer"]],
            7: [["p1","Red","Outer"],["p3","Red","Inner"]], 8: [["p1","Green","Outer"],["p3","Red","Inner"]],
            9: [["p1","Red","Inner"],["p3","Red","Inner"]], 10: [["p1","Green","Inner"],["p3","Red","Inner"]],
            11: [["p1","Red","Outer"],["p3","Red","Outer"]], 12: [["p1","Green","Outer"],["p3","Red","Outer"]],
            13: [["p1","Red","Inner"],["p3","Green","Outer"]], 14: [["p1","Green","Inner"],["p3","Green","Outer"]],
            15: [["p1","Red","Outer"],["p3","Green","Inner"]], 16: [["p1","Green","Outer"],["p3","Green","Inner"]],
            17: [["p1","Red","Inner"],["p3","Green","Inner"]], 18: [["p1","Green","Inner"],["p3","Green","Inner"]],
            19: [["p1","Red","Outer"],["p3","Green","Outer"]], 20: [["p1","Green","Outer"],["p3","Green","Outer"]]
        };

        const POS_MAP = {
            "Top": { "p1": [34, "X"], "p2": [50, "X"], "p3": [66, "X"], "Inner": 22, "Outer": 14 },
            "Right": { "p1": [34, "Y"], "p2": [50, "Y"], "p3": [66, "Y"], "Inner": 78, "Outer": 86 },
            "Bottom": { "p1": [66, "X"], "p2": [50, "X"], "p3": [34, "X"], "Inner": 78, "Outer": 86 },
            "Left": { "p1": [66, "Y"], "p2": [50, "Y"], "p3": [34, "Y"], "Inner": 22, "Outer": 14 }
        };

        const OPEN_GRID_COORDS = {
            "Top": { 1: [34, 23], 2: [66, 23], 3: [34, 18], 4: [66, 18], 5: [34, 13], 6: [66, 13] },
            "Right": { 1: [77, 34], 2: [77, 66], 3: [82, 34], 4: [82, 66], 5: [87, 34], 6: [87, 66] },
            "Bottom": { 1: [66, 77], 2: [34, 77], 3: [66, 82], 4: [34, 82], 5: [66, 87], 6: [34, 87] },
            "Left": { 1: [23, 66], 2: [23, 34], 3: [18, 66], 4: [18, 34], 5: [13, 66], 6: [13, 34] }
        };

        function triggerHighlightAt(l, t) {
            const container = document.getElementById('map-container');
            const ripple = document.createElement('div');
            ripple.className = 'highlight-ripple';
            ripple.style.left = `${l}%`; ripple.style.top = `${t}%`;
            container.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        }

        function addPillar(secId, pos, color, row, hasParking) {
            const actualRow = hasParking ? "Inner" : row; 
            const pInfo = POS_MAP[secId];
            const coordBase = pInfo[pos];
            const axis = coordBase[1];
            const pValue = coordBase[0];
            const rValue = pInfo[actualRow];
            
            const el = document.createElement('div');
            el.className = `overlay ${color === "Red" ? "pillar-red" : "pillar-green"}`;
            if (axis === "X") { el.style.left = `${pValue}%`; el.style.top = `${rValue}%`; }
            else { el.style.left = `${rValue}%`; el.style.top = `${pValue}%`; }
            document.getElementById('overlays-layer').appendChild(el);
            return { left: (axis === "X" ? pValue : rValue), top: (axis === "X" ? rValue : pValue) };
        }

        function drawParking(secId, withCar = false) {
            const el = document.createElement('div');
            el.className = 'parking-zone'; 
            if (withCar) { el.innerHTML = '<div class="car-in-parking">🚗</div>'; } 
            else { el.innerHTML = '<span style="color:#F702F9; font-weight:900; font-size:14px;">P</span>'; }
            let coords = {left: 0, top: 0};
            if(secId === "Top") { el.style.left='44%'; el.style.top='10%'; el.style.width='12%'; el.style.height='8%'; coords={left:50, top:14}; }
            if(secId === "Right") { el.style.left='82%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; coords={left:86, top:50}; }
            if(secId === "Bottom") { el.style.left='44%'; el.style.top='82%'; el.style.width='12%'; el.style.height='8%'; coords={left:50, top:86}; }
            if(secId === "Left") { el.style.left='10%'; el.style.top='44%'; el.style.width='8%'; el.style.height='12%'; coords={left:14, top:50}; }
            document.getElementById('overlays-layer').appendChild(el);
            return coords;
        }

        function drawWallBlock(secId, row) {
            const el = document.createElement('div'); el.className = 'wall-block';
            const rValue = POS_MAP[secId][row];
            if (secId === "Top" || secId === "Bottom") {
                el.style.top = `calc(${rValue}% - 3%)`; el.style.height = '6%'; el.style.left = '42%'; el.style.width = '16%';
            } else {
                el.style.left = `calc(${rValue}% - 3%)`; el.style.width = '6%'; el.style.top = '42%'; el.style.height = '16%';
            }
            document.getElementById('overlays-layer').appendChild(el);
        }

        function drawStartGrid(secId, activeZone, isWide) {
            const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6]; 
            validZones.forEach(zoneId => {
                const el = document.createElement('div');
                const isActive = (zoneId === activeZone);
                el.className = `start-zone-marker ${isActive ? 'start-zone-active' : ''}`;
                el.innerHTML = isActive ? '' : zoneId; 
                const xy = OPEN_GRID_COORDS[secId][zoneId];
                el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
                document.getElementById('overlays-layer').appendChild(el);
            });
        }

        function drawStartCar(secId, zoneId) {
            const el = document.createElement('div');
            el.className = 'open-car'; el.innerHTML = "🚗";
            const xy = OPEN_GRID_COORDS[secId][zoneId];
            el.style.left = `${xy[0]}%`; el.style.top = `${xy[1]}%`;
            document.getElementById('overlays-layer').appendChild(el);
            return { left: xy[0], top: xy[1] };
        }

        function restoreField(fullData) {
            resetDraw();
            const info = document.getElementById('result-info');
            if (fullData.type === 'open') {
                switchMode('open');
                const { isWide, startSec, zoneId } = fullData;
                let wallBlockSecs = ["Top", "Right", "Bottom", "Left"].filter(id => id !== startSec);
                wallBlockSecs.forEach(secId => drawWallBlock(secId, isWide ? "Outer" : "Inner"));
                drawStartGrid(startSec, zoneId, isWide);
                drawStartCar(startSec, zoneId);
                info.innerHTML = `<h2 class="section-title">🏁 資格賽 (還原)</h2>牆體: ${isWide ? "寬" : "窄"}<br>起點區: ${startSec}<br>位置: ${zoneId} 🚗`;
            } else {
                switchMode('obstacle');
                const { pSec, sSec, singleObj, doubleObjs } = fullData;
                drawParking(pSec, true);
                addPillar(sSec.id, singleObj.pos, singleObj.color, singleObj.lane, (sSec.id === pSec));
                doubleObjs.forEach(item => {
                    const hasP = (item.sec === pSec);
                    addPillar(item.sec, item.c1[0], item.c1[1], item.c1[2], hasP);
                    addPillar(item.sec, item.c2[0], item.c2[1], item.c2[2], hasP);
                });
                info.innerHTML = `<h2 class="section-title">🚧 決賽 (還原)</h2>停車場: ${pSec}<br>單一標誌區: ${sSec.id}`;
            }
            document.getElementById('mySidebar').classList.remove('active');
        }

        function addHistoryRecord(title, summaryHtml, rawData) {
            const historyList = document.getElementById('historyList');
            if (historyList.innerHTML.includes('尚無紀錄')) historyList.innerHTML = '';
            const now = new Date();
            const itemDiv = document.createElement('div');
            itemDiv.className = 'history-item';
            const jsonStr = encodeURIComponent(JSON.stringify(rawData));
            itemDiv.innerHTML = `
                <div class="history-item-top">
                    <label style="display:flex;align-items:center;gap:4px;"><input type="checkbox" class="record-checkbox"> <span class="history-title">${title}</span></label>
                    <button class="btn-delete-single" onclick="this.closest('.history-item').remove(); checkEmpty();">×</button>
                </div>
                <div class="history-time">${now.toLocaleDateString()} ${now.toLocaleTimeString()}</div>
                <div class="history-content">${summaryHtml}</div>
                <div class="history-actions">
                    <button class="btn-restore" onclick="restoreField(JSON.parse(decodeURIComponent('${jsonStr}')))">🔄 還原</button>
                    <div>
                        <button class="btn-mark-success" onclick="this.closest('.history-item').className='history-item success'">✅</button>
                        <button class="btn-mark-fail" onclick="this.closest('.history-item').className='history-item fail'">❌</button>
                    </div>
                </div>
            `;
            historyList.prepend(itemDiv);
        }

        function toggleSelectAll(btn) { document.querySelectorAll('.record-checkbox').forEach(cb => cb.checked = btn.checked); }
        function deleteSelectedRecords() {
            const checked = document.querySelectorAll('.record-checkbox:checked');
            if (checked.length === 0) return alert('請先勾選紀錄！');
            if (confirm(`確定刪除 ${checked.length} 筆？`)) {
                checked.forEach(cb => cb.closest('.history-item').remove());
                document.getElementById('selectAllCheckbox').checked = false;
                checkEmpty();
            }
        }
        function checkEmpty() {
            const list = document.getElementById('historyList');
            if (!list.querySelector('.history-item')) list.innerHTML = '<div style="text-align: center; color: #777; margin-top: 30px; font-size: 12px;">尚無紀錄</div>';
        }

        function runDraw() {
            resetDraw();
            const info = document.getElementById('result-info');
            let html = `<h2 class="section-title">${currentMode === 'open' ? '🏁 資格賽結果' : '🚧 決賽結果'}</h2>`;

            if (currentMode === 'open') {
                const isWide = tossCoin() === "Heads";
                const startSec = getSectionInfo();
                const validZones = isWide ? [1, 2, 3, 4, 5, 6] : [3, 4, 5, 6];
                const zoneId = validZones[Math.floor(Math.random() * validZones.length)];
                
                let wallBlockSecs = ["Top", "Right", "Bottom", "Left"].filter(id => id !== startSec.id);
                wallBlockSecs.forEach(secId => drawWallBlock(secId, isWide ? "Outer" : "Inner"));
                drawStartGrid(startSec.id, zoneId, isWide);
                const carXY = drawStartCar(startSec.id, zoneId);

                html += `• 牆體: <span class="interactive-text" onclick="triggerHighlightAt(50, 22)">${isWide ? "寬" : "窄"}</span><br>`;
                html += `• 起點區: <span class="interactive-text" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">${startSec.name}</span><br>`;
                html += `• 車輛位置: <span class="interactive-text" style="color:#ff3300;" onclick="triggerHighlightAt(${carXY.left}, ${carXY.top})">位置 ${zoneId} 🚗</span>`;

                addHistoryRecord('🏁 資格賽', `牆:${isWide?"寬":"窄"} | 區:${startSec.name} | 格:${zoneId}`, { type: 'open', isWide, startSec: startSec.id, zoneId });
            } else {
                const s = getSectionInfo(); 
                const p = getSectionInfo(); 
                const parkingXY = drawParking(p.id, true);

                html += `• 停車場: <span class="interactive-text" style="color:#F702F9;" onclick="triggerHighlightAt(${parkingXY.left}, ${parkingXY.top})">${p.name} 🚗</span><br>`;
                html += `• 單一標誌區: <span class="interactive-text" onclick="triggerHighlightAt(50, 50)">${s.name}</span><br>`;
                
                const sPos = ["p1", "p2", "p3"][Math.floor(Math.random() * 3)];
                const sColor = Math.random() < 0.5 ? "Green" : "Red";
                const sLane = Math.random() < 0.5 ? "Inner" : "Outer";
                const singlePillarCoord = addPillar(s.id, sPos, sColor, sLane, (s.id === p.id));
                const singleObj = { pos: sPos, color: sColor, lane: sLane };

                html += `• 單一標誌: <span class="interactive-text" style="color:${sColor==='Green'?'#008000':'#cc0000'};" onclick="triggerHighlightAt(${singlePillarCoord.left}, ${singlePillarCoord.top})">${sColor==='Green'?'綠':'紅'} (${sLane}, ${sPos})</span><br>`;
                
                let doubleDeck = Array.from({length: 16}, (_, i) => i + 5).sort(() => Math.random() - 0.5);
                let doubleSummary = '', doubleObjs = [];
                ["Top", "Right", "Bottom", "Left"].forEach(secId => {
                    if (secId !== s.id) {
                        const cardNum = doubleDeck.pop();
                        const data = CARD_LAYOUTS[cardNum];
                        addPillar(secId, data[0][0], data[0][1], data[0][2], (secId === p.id));
                        addPillar(secId, data[1][0], data[1][1], data[1][2], (secId === p.id));
                        doubleObjs.push({ sec: secId, cardNum, c1: data[0], c2: data[1] });
                        doubleSummary += `[${secId}]卡${cardNum} `;
                    }
                });
                html += `• 雙標誌區已佈置完畢`;

                addHistoryRecord('🚧 決賽', `停車:${p.name} | 單標:${s.name}`, { type: 'obstacle', pSec: p.id, sSec: s, singleObj, doubleObjs });
            }
            info.innerHTML = html;
        }
    </script>
</body>
</html>
